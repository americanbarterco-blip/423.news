<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<meta name="description" content="Claudia Green — the standalone 423.news voice assistant.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claudia Green">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/claudia-icon-192.png">
<link rel="icon" href="./claudia-icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<title>Claudia Green</title>
<style>
/* Keep the exact Claudia widget markup, colors, typography, portrait/video, and controls
   from /claudia-livekit.js. Only move its existing panel into the standalone viewport. */
html,body{margin:0;min-height:100%;width:100%;background:#080c14}
#cg-livekit-launch{display:none!important}
#cg-livekit-panel{
 display:block;
 position:fixed!important;
 left:50%!important;
 top:50%!important;
 right:auto!important;
 bottom:auto!important;
 transform:translate(-50%,-50%)!important;
 width:min(340px,calc(100vw - 28px))!important;
 max-height:calc(100svh - 28px)!important;
 overflow-y:auto!important;
}
#claudia-install-cta{position:fixed;z-index:10000;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);border:0;border-radius:999px;background:#16a36a;color:#fff;padding:13px 22px;font:700 15px/1.2 system-ui,sans-serif;box-shadow:0 8px 28px #0009;white-space:nowrap}
#claudia-install-help{position:fixed;inset:0;z-index:10001;background:#000b;display:none;place-items:center;padding:22px;font:15px/1.5 system-ui,sans-serif;color:#edf5fb}
#claudia-install-help>section{width:min(360px,100%);box-sizing:border-box;background:#101c29;border:1px solid #34485a;border-radius:18px;padding:22px}
#claudia-install-help h2{margin:0 0 10px;font-size:20px}
#claudia-install-help button{border:0;border-radius:999px;background:#16a36a;color:#fff;padding:10px 18px;font-weight:700}
</style>
</head>
<body>
<script src="/claudia-livekit.js"></script>
<script>
(function(){
 const wait=setInterval(function(){
  const panel=document.getElementById("cg-livekit-panel");
  if(!panel)return;
  clearInterval(wait);
  panel.style.display="block";
  if("serviceWorker" in navigator){
   navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});
  }
  const close=panel.querySelector("#cg-livekit-close");
  const welcome=document.createElement("main");
  welcome.id="claudia-welcome";
  welcome.innerHTML='<section><div class="cg-welcome-mark">CG</div><h1>Claudia Green</h1><p>Your 423.news voice companion is ready.</p><button type="button" id="claudia-open-chat">Open Claudia</button></section>';
  welcome.style.cssText="position:fixed;inset:0;z-index:10000;display:none;place-items:center;padding:24px;background:#080c14;color:#edf5fb;text-align:center;font:15px/1.5 system-ui,sans-serif";
  const welcomeStyle=document.createElement("style");
  welcomeStyle.textContent="#claudia-welcome section{width:min(360px,100%);box-sizing:border-box;background:#101722;border:1px solid #354052;border-radius:20px;padding:28px;box-shadow:0 18px 50px #0009}#claudia-welcome h1{font:700 26px Georgia,serif;margin:12px 0 6px}#claudia-welcome p{color:#b9c4d3;margin:0 0 22px}#claudia-welcome .cg-welcome-mark{width:54px;height:54px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#123d32;color:#eafff5;font-weight:800;font-size:20px}#claudia-welcome button{border:0;border-radius:999px;background:#b72d2a;color:#fff;padding:12px 22px;font:700 15px system-ui;cursor:pointer}";
  document.head.appendChild(welcomeStyle);
  document.body.appendChild(welcome);
  function showWelcome(){
    const stop=panel.querySelector("#cg-livekit-stop");
    if(stop&&!stop.disabled)stop.click();
    panel.style.setProperty("display","none","important");
    welcome.style.display="grid";
  }
  if(close){
    close.addEventListener("click",function(event){
      event.preventDefault();
      event.stopImmediatePropagation();
      showWelcome();
    },true);
  }
  welcome.querySelector("#claudia-open-chat").addEventListener("click",function(){
    welcome.style.display="none";
    panel.style.setProperty("display","block","important");
  });
})();
</script>
</body>
</html>
