<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131f">
<meta name="description" content="Talk with Claudia Green, your standalone 423-area voice companion.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claudia">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Claudia Green</title>
<style>
:root{color-scheme:dark;--bg:#07131f;--panel:#102235;--line:#29445b;--text:#f2f8fc;--muted:#a6bacb;--green:#54d6a0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100svh;overflow:hidden}
#app{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#163b4d 0,#07131f 62%);padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.top{height:66px;display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto}
.top img{width:44px;height:44px;border-radius:14px;object-fit:cover}
.top h1{font-size:19px;margin:0;font-weight:750}
.top p{font-size:12px;color:var(--muted);margin:0}
#app-status{max-width:560px;width:100%;margin:0 auto 8px;color:var(--muted);font-size:12px;text-align:center}
#chat-host{position:relative;flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto}
#cg-livekit-launch{display:none!important}
#cg-3d{display:none!important}
#cg-livekit-panel{display:block!important;position:absolute!important;inset:0!important;left:0!important;right:0!important;top:0!important;bottom:0!important;transform:none!important;width:100%!important;max-height:none!important;height:100%!important;overflow:auto!important;border:1px solid var(--line)!important;border-radius:22px!important;padding:18px!important;background:linear-gradient(165deg,#102b40,#091724)!important;box-shadow:0 18px 55px #0007!important}
#cg-livekit-panel #cg-livekit-header h2{font-size:23px!important}
#cg-livekit-panel #cg-livekit-header{padding-bottom:10px;border-bottom:1px solid #29445b}
#cg-livekit-panel>div:nth-of-type(1){color:var(--muted);margin-top:10px}
#cg-livekit-status{font-size:14px!important;min-height:48px!important;padding:12px!important;border-radius:12px;background:#07131f;margin:18px 0!important}
#cg-livekit-actions{display:grid!important;grid-template-columns:1fr 1fr;gap:10px!important}
#cg-livekit-actions button{min-height:54px;font-size:15px}
#cg-livekit-actions button.primary{background:linear-gradient(120deg,#176b62,#168d78)!important;border-color:#54d6a0!important}
#cg-livekit-note{font-size:12px!important;line-height:1.5}
.footer{max-width:560px;width:100%;margin:10px auto 0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));text-align:center;color:#8199aa;font-size:11px}
</style>
</head>
<body>
<div id="app">
<header class="top"><img src="/apple-touch-icon.png" alt="Claudia chat icon"><div><h1>Claudia Green</h1><p>Your 423-area voice companion</p></div></header>
<div id="app-status" role="status">Ready when you are.</div>
<main id="chat-host" aria-label="Claudia Green chat"></main>
<footer class="footer">Voice chat needs an internet connection and microphone permission. For emergencies, call 911.</footer>
</div>
<script src="/claudia-livekit.js"></script>
<script>
(function(){
 const status=document.getElementById('app-status');
 function ready(){
  const panel=document.getElementById('cg-livekit-panel');
  const launcher=document.getElementById('cg-livekit-launch');
  if(!panel||!launcher){status.textContent='Claudia is loading. Please wait a moment.';return false;}
  const host=document.getElementById('chat-host');
  if(panel.parentElement!==host)host.appendChild(panel);
  panel.style.display='block';
  launcher.style.display='none';
  const inner=panel.querySelector('#cg-livekit-status');
  if(inner)status.textContent='Claudia is ready. Tap Start voice chat to begin.';
  return true;
 }
 let tries=0;
 const timer=setInterval(function(){tries++;if(ready()||tries>30)clearInterval(timer);},100);
 if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){status.textContent='Chat is ready. Offline installation support could not be enabled.';});}
})();
</script>
</body>
</html>
