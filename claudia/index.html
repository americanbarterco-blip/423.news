<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<meta name="description" content="Claudia Green — the standalone 423.news voice assistant.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claudia Green">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/claudia-icon-192.png">
<link rel="icon" href="./claudia-icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<title>Claudia Green</title>
<style>
html,body{margin:0;min-height:100%;width:100%;background:#080c14}
#cg-livekit-launch{display:none!important}
#cg-livekit-panel{display:block;position:fixed!important;left:50%!important;top:50%!important;right:auto!important;bottom:auto!important;transform:translate(-50%,-50%)!important;width:min(340px,calc(100vw - 28px))!important;max-height:calc(100svh - 28px)!important;overflow-y:auto!important}
#claudia-install-cta{position:fixed;z-index:10000;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);border:0;border-radius:999px;background:#16a36a;color:#fff;padding:13px 22px;font:700 15px/1.2 system-ui,sans-serif;box-shadow:0 8px 28px #0009;white-space:nowrap}
#claudia-install-help{position:fixed;inset:0;z-index:10001;background:#000b;display:none;place-items:center;padding:22px;font:15px/1.5 system-ui,sans-serif;color:#edf5fb}
#claudia-install-help>section{width:min(360px,100%);box-sizing:border-box;background:#101c29;border:1px solid #34485a;border-radius:18px;padding:22px}
#claudia-install-help h2{margin:0 0 10px;font-size:20px}
#claudia-install-help button{border:0;border-radius:999px;background:#16a36a;color:#fff;padding:10px 18px;font-weight:700}
</style>
</head>
<body>
<script src="/claudia-livekit.js"></script>
<script>
(function(){
 const wait=setInterval(function(){
  const panel=document.getElementById("cg-livekit-panel");
  if(!panel)return;
  clearInterval(wait);
  panel.style.display="block";
  if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(function(){});
  const close=panel.querySelector("#cg-livekit-close");
  if(close)close.addEventListener("click",function(event){
   event.preventDefault();event.stopImmediatePropagation();
   const stop=panel.querySelector("#cg-livekit-stop");if(stop&&!stop.disabled)stop.click();
   panel.style.setProperty("display","none","important");
   try{window.close()}catch(_){}
   window.setTimeout(function(){if(!window.closed){const exit=document.getElementById("claudia-exit-screen");if(exit)exit.style.display="grid"}},250);
  },true);
 },50);
 const exit=document.createElement("div");exit.id="claudia-exit-screen";
 exit.innerHTML='<section><h2>Claudia is closed</h2><p>Android does not let a webpage force-close every installed app window. Use your phone’s Back or Home control to leave Claudia.</p><button type="button" id="claudia-reopen">Reopen Claudia</button></section>';
 exit.style.cssText="position:fixed;inset:0;z-index:20000;display:none;place-items:center;padding:22px;background:#080c14;color:#edf5fb;font:15px/1.5 system-ui,sans-serif";
 const style=document.createElement("style");style.textContent="#claudia-exit-screen section{width:min(360px,100%);box-sizing:border-box;background:#101c29;border:1px solid #34485a;border-radius:18px;padding:22px}#claudia-exit-screen h2{margin:0 0 10px;font-size:20px}#claudia-exit-screen button{border:0;border-radius:999px;background:#16a36a;color:#fff;padding:10px 18px;font-weight:700}";
 document.head.appendChild(style);
 document.addEventListener("DOMContentLoaded",function(){document.body.appendChild(exit);exit.querySelector("#claudia-reopen").addEventListener("click",function(){exit.style.display="none";const panel=document.getElementById("cg-livekit-panel");if(panel)panel.style.setProperty("display","block","important")})});
})();
</script>
</body>
</html>
