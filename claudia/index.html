<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<meta name="description" content="Claudia Green — the standalone 423.news voice assistant.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claudia Green">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Claudia Green</title>
<style>
/* Keep the exact Claudia widget markup, colors, typography, portrait/video, and controls
   from /claudia-livekit.js. Only move its existing panel into the standalone viewport. */
html,body{margin:0;min-height:100%;width:100%;background:#080c14}
#cg-livekit-launch{display:none!important}
#cg-livekit-panel{
 display:block!important;
 position:fixed!important;
 left:50%!important;
 top:50%!important;
 right:auto!important;
 bottom:auto!important;
 transform:translate(-50%,-50%)!important;
 width:min(340px,calc(100vw - 28px))!important;
 max-height:calc(100svh - 28px)!important;
 overflow-y:auto!important;
}
#cg-livekit-panel[style*="display: none"]{display:block!important}
#cg-livekit-close{display:none!important}
</style>
</head>
<body>
<script src="/claudia-livekit.js"></script>
<script>
(function(){
 const wait=setInterval(function(){
  const panel=document.getElementById("cg-livekit-panel");
  if(!panel)return;
  clearInterval(wait);
  panel.style.display="block";
  const launcher=document.getElementById("cg-livekit-launch");
  if(launcher)launcher.remove();
  if("serviceWorker" in navigator){
   navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});
  }
 },50);
})();
</script>
</body>
</html>
