<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101722">
<meta name="description" content="Claudia Green — the standalone 423.news voice assistant.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claudia Green">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="./claudia-icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<title>Claudia Green</title>
<style>
/* Keep the exact Claudia widget markup, colors, typography, portrait/video, and controls
   from /claudia-livekit.js. Only move its existing panel into the standalone viewport. */
html,body{margin:0;min-height:100%;width:100%;background:#080c14}
#cg-livekit-launch{display:none!important}
#cg-livekit-panel{
 display:block!important;
 position:fixed!important;
 left:50%!important;
 top:50%!important;
 right:auto!important;
 bottom:auto!important;
 transform:translate(-50%,-50%)!important;
 width:min(340px,calc(100vw - 28px))!important;
 max-height:calc(100svh - 28px)!important;
 overflow-y:auto!important;
}
#claudia-install-cta{position:fixed;z-index:10000;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);border:0;border-radius:999px;background:#16a36a;color:#fff;padding:13px 22px;font:700 15px/1.2 system-ui,sans-serif;box-shadow:0 8px 28px #0009;white-space:nowrap}
#claudia-install-help{position:fixed;inset:0;z-index:10001;background:#000b;display:none;place-items:center;padding:22px;font:15px/1.5 system-ui,sans-serif;color:#edf5fb}
#claudia-install-help>section{width:min(360px,100%);box-sizing:border-box;background:#101c29;border:1px solid #34485a;border-radius:18px;padding:22px}
#claudia-install-help h2{margin:0 0 10px;font-size:20px}
#claudia-install-help button{border:0;border-radius:999px;background:#16a36a;color:#fff;padding:10px 18px;font-weight:700}
</style>
</head>
<body>
<script src="/claudia-livekit.js"></script>
<script>
(function(){
 const wait=setInterval(function(){
  const panel=document.getElementById("cg-livekit-panel");
  if(!panel)return;
  clearInterval(wait);
  panel.style.display="block";
  const launcher=document.getElementById("cg-livekit-launch");
  if(launcher)launcher.remove();
  if("serviceWorker" in navigator){
   navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});
  }
 },50);

 const installButton=document.createElement("button");
 installButton.id="claudia-install-cta";
 installButton.type="button";
 installButton.textContent="📲 Install Claudia";
 const help=document.createElement("div");
 help.id="claudia-install-help";
 help.innerHTML='<section><h2>Install Claudia</h2><p id="claudia-install-steps">Add Claudia to your home screen so she opens like a regular app.</p><button type="button" id="claudia-install-close">Got it</button></section>';
 document.addEventListener("DOMContentLoaded",function(){
  if(window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true)return;
  document.body.appendChild(installButton);
  document.body.appendChild(help);
 });
 let installPrompt=null;
 window.addEventListener("beforeinstallprompt",function(event){
  event.preventDefault();
  installPrompt=event;
  installButton.textContent="📲 Install Claudia";
 });
 window.addEventListener("appinstalled",function(){
  installPrompt=null;
  installButton.remove();
  help.remove();
 });
 installButton.addEventListener("click",async function(){
  if(installPrompt){
   const promptEvent=installPrompt;
   installPrompt=null;
   await promptEvent.prompt();
   const choice=await promptEvent.userChoice;
   if(choice&&choice.outcome==="accepted")installButton.remove();
   return;
  }
  const ua=navigator.userAgent||"";
  const steps=document.getElementById("claudia-install-steps");
  if(/android/i.test(ua)){
   steps.innerHTML='In Chrome, tap the <b>⋮</b> menu, choose <b>Install app</b> or <b>Add to Home screen</b>, then confirm. If you do not see that option yet, reload this page in Chrome and try again.';
  }else if(/iphone|ipad|ipod/i.test(ua)){
   steps.innerHTML='Open this page in Safari, tap <b>Share</b>, choose <b>Add to Home Screen</b>, then tap <b>Add</b>.';
  }else{
   steps.innerHTML='Use your browser menu or address-bar install icon and choose <b>Install Claudia</b>.';
  }
  help.style.display="grid";
 });
 help.addEventListener("click",function(event){
  if(event.target===help||event.target.id==="claudia-install-close")help.style.display="none";
 });
})();
</script>
</body>
</html>
