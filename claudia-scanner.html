<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudia Green Live Scanner Wire — 423.news</title>
<meta name="description" content="Claudia Green's Live Scanner Wire: filed reports, confidence labels and what they mean for you. Not an emergency service.">
<link rel="canonical" href="./claudia-scanner.html">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* Claudia Green Live Scanner Wire — scoped to .cg so the rest of 423.news is untouched. */
.cg {
  --cg-bg: #020d19; --cg-panel: #041729; --cg-panel2: #071d32; --cg-line: #123b59;
  --cg-blue: #087fff; --cg-cyan: #00cfff; --cg-text: #f5f8ff; --cg-muted: #a9bed2;
  --cg-live: #f3263d; --cg-police: #1f7aff; --cg-fire: #ff303a; --cg-ems: #f4b000;
  --cg-traffic: #11c879; --cg-weather: #8055ff; --cg-community: #00cfff; --cg-demo: #f4b000;
  color: var(--cg-text);
}
body.cg-page .wrap { max-width: 1440px; }
body.cg-page main { padding-top: 16px; }
body.cg-page #nav a.on, body.cg-page #nav a:hover { border-bottom-color: var(--cg-blue); }

.cg * { box-sizing: border-box; }
.cg button { font: inherit; color: inherit; cursor: pointer; }
.cg button:disabled, .cg [aria-disabled="true"] { cursor: not-allowed; }
.cg h1, .cg h2, .cg h3, .cg p { margin: 0; }
.cg input[type="search"], .cg select {
  margin: 0; width: 100%; background: var(--cg-bg); color: var(--cg-text);
  border: 1px solid var(--cg-line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.cg :focus-visible { outline: 2px solid var(--cg-cyan); outline-offset: 2px; }
.cg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- hero ---------- */
.cg-hero {
  position: relative; display: grid; grid-template-columns: minmax(150px, 24%) 1fr minmax(180px, 25%);
  min-height: 220px; border: 1px solid var(--cg-line); border-radius: 14px; overflow: hidden;
  background: linear-gradient(100deg, #06223d 0%, #020d19 55%, #04162a 100%); margin-bottom: 14px;
}
.cg-hero-portrait { position: relative; min-height: 220px; }
.cg-hero-portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 72% 20%; }
.cg-hero-portrait::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 55%, #05182b 100%); }
.cg-illus { position: absolute; left: 8px; bottom: 8px; z-index: 1; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(2,13,25,.8); color: var(--cg-muted); }
.cg-hero-copy { position: relative; z-index: 1; padding: 22px 22px 18px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.cg-hero-copy h1 { font-size: clamp(28px, 3.5vw, 50px); line-height: 1; font-weight: 900; letter-spacing: -.015em; text-transform: uppercase; }
.cg-hero-copy h1 span { display: block; background: linear-gradient(90deg, var(--cg-blue), var(--cg-cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cg-hero-tag { font-weight: 700; letter-spacing: .06em; font-size: clamp(11px, 1.4vw, 15px); color: var(--cg-text); }
.cg-hero-room { position: relative; }
.cg-hero-room img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 40% 40%; opacity: .9; }
.cg-hero-room::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, #04162a 0%, rgba(4,22,42,0) 45%), linear-gradient(0deg, rgba(2,13,25,.85), rgba(2,13,25,0) 55%); }
.cg-hero-brand { position: absolute; z-index: 2; right: 18px; bottom: 14px; text-align: right; font-weight: 800; line-height: 1.15; }
.cg-hero-brand p { font-size: clamp(13px, 1.6vw, 20px); }
.cg-hero-brand b { display: block; margin-top: 4px; font-size: clamp(20px, 2.6vw, 34px); letter-spacing: -.02em; }
.cg-hero-brand b i { color: var(--cg-live); font-style: normal; }
.cg-hero-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cg-hero-wx { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: rgba(2,13,25,.75); border: 1px solid var(--cg-line); }
.cg-hero-wx[hidden] { display: none; }

/* state pill: LIVE / DEMO / PAUSED / OFFLINE — always text + color */
.cg-pill { display: inline-flex; align-items: center; gap: 7px; align-self: flex-start; font-weight: 800; font-size: 13px; letter-spacing: .05em; padding: 5px 12px; border-radius: 8px; color: #fff; background: var(--cg-live); text-transform: uppercase; }
.cg-pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
.cg-pill[data-s="live"]::before { animation: cgPulse 1.8s ease-in-out infinite; }
.cg-pill[data-s="demo"] { background: var(--cg-demo); color: #1b1300; }
.cg-pill[data-s="demo"]::before { background: #1b1300; }
.cg-pill[data-s="paused"], .cg-pill[data-s="loading"], .cg-pill[data-s="none"] { background: #3a5068; }
.cg-pill[data-s="offline"], .cg-pill[data-s="error"] { background: #7a2430; }
@keyframes cgPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.cg-warn { margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; font-size: 14px; background: #2b2105; border: 1px solid #7a5c00; color: #ffe19a; }
.cg-warn[hidden] { display: none; }
.cg-note { margin: 0 0 14px; font-size: 13px; color: var(--cg-muted); }

/* ---------- dashboard grid ---------- */
.cg-dash {
  display: grid; gap: 14px; align-items: stretch;
  grid-template-columns: minmax(310px, 1.05fr) minmax(0, 1.55fr) minmax(290px, .82fr);
  grid-template-rows: minmax(600px, 700px) auto;
  grid-template-areas: "feed map side" "latest latest side";
}
.cg-side { grid-area: side; display: flex; flex-direction: column; gap: 14px; }
.cg-panel { background: var(--cg-panel); border: 1px solid var(--cg-line); border-radius: 14px; padding: 16px; min-width: 0; }
.cg-panel > h2, .cg-ph h2 { font-size: 17px; font-weight: 800; }
.cg-ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.cg-ph-l { display: flex; align-items: center; gap: 10px; min-width: 0; }

/* ---------- incident feed ---------- */
.cg-feed { grid-area: feed; display: flex; flex-direction: column; min-height: 0; }
.cg-feed-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cg-sw { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; min-height: 44px; font-size: 13px; color: var(--cg-muted); }
.cg-sw .tr { width: 44px; height: 26px; border-radius: 99px; background: #3a5068; position: relative; transition: background .15s; flex: 0 0 auto; }
.cg-sw .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.cg-sw[aria-checked="true"] .tr { background: var(--cg-blue); }
.cg-sw[aria-checked="true"] .tr::after { transform: translateX(18px); }
.cg-sw[aria-disabled="true"] { opacity: .55; }
.cg-stamp { font-size: 12px; color: var(--cg-muted); }
.cg-iconbtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: var(--cg-panel2); border: 1px solid var(--cg-line); }
.cg-iconbtn:hover:not(:disabled) { border-color: var(--cg-cyan); }
.cg-iconbtn svg { width: 20px; height: 20px; }

.cg-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: thin; }
.cg-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px; border-radius: 99px; background: var(--cg-panel2); border: 1px solid var(--cg-line); font-size: 14px; font-weight: 600; white-space: nowrap; }
.cg-chip svg { width: 16px; height: 16px; }
.cg-chip:hover { border-color: var(--cg-blue); }
.cg-chip[aria-pressed="true"] { background: var(--cg-blue); border-color: var(--cg-blue); color: #fff; }
.cg-search { display: flex; gap: 8px; margin-bottom: 10px; }
.cg-search input { flex: 1; }
.cg-search select { flex: 0 1 150px; }

.cg-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; border-top: 1px solid var(--cg-line); }
.cg-item { display: flex; align-items: stretch; border-bottom: 1px solid var(--cg-line); }
.cg-row { flex: 1; min-width: 0; display: grid; grid-template-columns: 44px 1fr; gap: 12px; text-align: left; background: none; border: 0; padding: 12px 4px; border-radius: 8px; }
.cg-row:hover { background: var(--cg-panel2); }
.cg-item[data-sel="true"] { background: var(--cg-panel2); box-shadow: inset 3px 0 0 var(--cg-cyan); }
.cg-ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--c); color: #fff; flex: 0 0 auto; }
.cg-ico svg { width: 22px; height: 22px; }
.cg-row-main { min-width: 0; }
.cg-row-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--cg-muted); }
.cg-row-main, .cg-row .t, .cg-row .loc, .cg-row .desc { display: block; }
.cg-row .t { font-size: 15px; font-weight: 700; margin: 2px 0; }
.cg-row .loc { font-size: 13px; color: var(--cg-muted); }
.cg-row .desc { font-size: 13px; color: #c9d8e6; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cg-more { align-self: center; flex: 0 0 auto; min-width: 44px; min-height: 44px; background: none; border: 0; color: var(--cg-cyan); font-size: 13px; font-weight: 700; padding: 0 8px; }
.cg-more:hover { text-decoration: underline; }
.cg-tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--c, var(--cg-line)); color: var(--c, var(--cg-muted)); background: color-mix(in srgb, var(--c, #3a5068) 14%, transparent); }
.cg-tag.st { --c: #7d94aa; }
.cg-tag.st[data-st="verified"] { --c: #2fd18a; }
.cg-tag.st[data-st="developing"] { --c: #ffb020; }
.cg-tag.st[data-st="resolved"] { --c: #7fa3c7; }
.cg-tag.demo { --c: var(--cg-demo); }

.cg-state { padding: 28px 12px; text-align: center; color: var(--cg-muted); font-size: 14px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.cg-state strong { color: var(--cg-text); font-size: 16px; }
.cg-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; font-weight: 700; font-size: 14px; border: 1px solid var(--cg-blue); background: var(--cg-blue); color: #fff; }
.cg-btn:hover:not(:disabled) { filter: brightness(1.12); }
.cg-btn.sec { background: transparent; color: var(--cg-text); border-color: var(--cg-line); }
.cg-btn.sec:hover:not(:disabled) { border-color: var(--cg-cyan); }
.cg-btn:disabled { opacity: .5; }
.cg-btn svg { width: 20px; height: 20px; flex: 0 0 auto; }

/* ---------- map ---------- */
.cg-map { grid-area: map; display: flex; flex-direction: column; min-height: 0; padding: 12px; }
.cg-map .cg-ph { padding: 0 4px; }
.cg-map-box { position: relative; flex: 1; min-height: 340px; border-radius: 10px; overflow: hidden; border: 1px solid var(--cg-line); background: #0a1c2c; isolation: isolate; }
.cg-leaf { position: absolute; inset: 0; z-index: 0; }
.cg-zoom { position: absolute; right: 10px; bottom: 14px; z-index: 500; display: flex; flex-direction: column; gap: 6px; }
.cg-zoom button { width: 44px; height: 44px; border-radius: 10px; background: rgba(4,23,41,.94); border: 1px solid var(--cg-line); font-size: 22px; line-height: 1; display: grid; place-items: center; }
.cg-zoom button:hover:not(:disabled) { border-color: var(--cg-cyan); }
.cg-zoom button:disabled { opacity: .4; }
.cg-zoom svg { width: 20px; height: 20px; }
.cg-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 12px 4px 0; font-size: 13px; }
.cg-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cg-legend i { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--c); color: #fff; }
.cg-legend i svg { width: 11px; height: 11px; }
.cg-legend .mapped { margin-left: auto; color: var(--cg-muted); }
.cg-fb { position: absolute; inset: 0; background-color: #0b2236; background-image: linear-gradient(rgba(18,59,89,.55) 1px, transparent 1px), linear-gradient(90deg, rgba(18,59,89,.55) 1px, transparent 1px); background-size: 12.5% 16.66%; }
.cg-fb-msg { position: absolute; left: 10px; top: 10px; right: 64px; z-index: 5; font-size: 12px; padding: 6px 10px; border-radius: 8px; background: rgba(4,23,41,.92); border: 1px solid var(--cg-line); color: var(--cg-muted); }
.cg-fb-pin { position: absolute; transform: translate(-50%, -100%); padding: 0; background: none; border: 0; }
.cg-fb-pop { position: absolute; left: 10px; right: 64px; bottom: 12px; z-index: 6; }
.cg-pin { background: none; border: 0; }
.cg-pinb { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--c); border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.55); color: #fff; }
.cg-pinb svg { width: 17px; height: 17px; transform: rotate(45deg); }
.cg-pinb[data-sel="true"] { outline: 3px solid var(--cg-cyan); outline-offset: 2px; }
.cg-pinb[data-res="true"] { opacity: .65; }
.cg-card { color: #f5f8ff; font-size: 13px; line-height: 1.4; min-width: 200px; }
.cg-card h3 { font-size: 15px; margin: 6px 0 2px; }
.cg-card .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cg-card button.cg-btn { min-height: 36px; margin-top: 8px; padding: 0 12px; }
.cg-fb-pop .cg-card { background: var(--cg-panel); border: 1px solid var(--cg-line); border-radius: 10px; padding: 10px 12px; }
/* Leaflet popup theming (rules only matter once Leaflet is loaded) */
.cg .leaflet-popup-content-wrapper, .cg .leaflet-popup-tip { background: var(--cg-panel); color: var(--cg-text); border: 1px solid var(--cg-line); }
.cg .leaflet-container { font: inherit; background: #0a1c2c; }
.cg .leaflet-control-attribution { background: rgba(2,13,25,.8); color: var(--cg-muted); font-size: 10px; }
.cg .leaflet-control-attribution a { color: var(--cg-cyan); }

/* ---------- scanner audio ---------- */
.cg-audio-st { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; font-size: 13px; }
.cg-onair { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 12px; letter-spacing: .05em; padding: 4px 10px; border-radius: 99px; background: #3a5068; color: #fff; text-transform: uppercase; }
.cg-onair[data-s="playing"] { background: var(--cg-live); }
.cg-onair[data-s="error"] { background: #7a2430; }
.cg-dotg { display: inline-flex; align-items: center; gap: 6px; color: var(--cg-muted); }
.cg-dotg::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #7d94aa; }
.cg-dotg[data-s="playing"]::before { background: #2fd18a; }
.cg-dotg[data-s="error"]::before { background: var(--cg-live); }
.cg-wave { display: block; width: 100%; height: 64px; border-radius: 8px; background: var(--cg-bg); border: 1px solid var(--cg-line); }
.cg-wave-wrap { position: relative; }
.cg-wave-msg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--cg-muted); pointer-events: none; }
.cg-player { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
.cg-play { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; background: #fff; color: #041729; border: 0; display: grid; place-items: center; }
.cg-play:disabled { background: #3a5068; color: #8aa0b5; }
.cg-play svg { width: 22px; height: 22px; }
.cg-player input[type="range"] { flex: 1; min-width: 0; margin: 0; padding: 0; height: 28px; background: transparent; border: 0; accent-color: var(--cg-blue); }
.cg-sub { font-size: 14px; font-weight: 700; margin: 14px 0 4px; }
.cg-ctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.cg-ctl > span { font-size: 14px; }
.cg-ctl small { display: block; font-size: 11px; color: var(--cg-muted); }
.cg-voice-note { font-size: 12px; color: var(--cg-muted); margin-top: 8px; }
.cg-speak { display: flex; gap: 8px; margin-top: 10px; }
.cg-speak .cg-btn:first-child { flex: 1; background: #4a3fd0; border-color: #4a3fd0; }
.cg-speak .cg-btn:first-child:hover:not(:disabled) { background: #5a4ff0; }

/* ---------- quick actions ---------- */
.cg-qa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.cg-qa .wide { grid-column: 1 / -1; }
.cg-qa .cg-btn { flex-direction: column; min-height: 64px; text-align: center; line-height: 1.2; padding: 8px 10px; }
.cg-qa .ann { background: #4a3fd0; border-color: #4a3fd0; }
.cg-qa .add { background: #12905f; border-color: #12905f; }
.cg-qa .wide { flex-direction: row; min-height: 52px; }
.cg-qa svg { width: 20px; height: 20px; }
.cg-qa small { font-weight: 500; font-size: 11px; opacity: .85; }
.cg-auth { font-size: 12px; color: var(--cg-muted); margin-top: 10px; }

/* ---------- latest incidents ---------- */
.cg-latest { grid-area: latest; align-self: start; }
.cg-cards { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
.cg-cardl { flex: 1 0 230px; scroll-snap-align: start; display: grid; gap: 4px; padding: 12px; border-radius: 12px; background: var(--cg-panel2); border: 1px solid var(--cg-line); }
.cg-cardl:hover { border-color: var(--cg-cyan); }
.cg-cardl .h { display: flex; align-items: center; gap: 10px; font-weight: 800; }
.cg-cardl .h .cg-ico { width: 34px; height: 34px; }
.cg-cardl .h .cg-ico svg { width: 18px; height: 18px; }
.cg-cardl .h time { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--cg-muted); }
.cg-cardl b { font-size: 14px; }
.cg-cardl span.l { font-size: 13px; color: var(--cg-muted); }

/* ---------- sources + footer ---------- */
.cg-srcs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cg-src { display: grid; gap: 2px; padding: 12px; border-radius: 10px; background: var(--cg-panel2); border: 1px solid var(--cg-line); font-size: 13px; }
.cg-src:hover { border-color: var(--cg-cyan); }
.cg-src b { font-size: 14px; }
.cg-src span { color: var(--cg-muted); font-size: 12px; }
.cg-priv { display: flex; gap: 10px; font-size: 12px; color: var(--cg-muted); }
.cg-priv svg { flex: 0 0 22px; width: 22px; height: 22px; color: var(--cg-cyan); }
.cg-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin-top: 14px; padding: 14px 18px; border: 1px solid var(--cg-line); border-radius: 14px; background: var(--cg-panel); font-size: 14px; }
.cg-foot b { font-size: 22px; letter-spacing: -.02em; }
.cg-foot b i { font-style: normal; color: var(--cg-live); }
.cg-foot a { color: var(--cg-cyan); font-weight: 700; }
.cg-foot .r { margin-left: auto; color: var(--cg-muted); }

/* detail dialog (inside the site's #modal) */
.cg-detail { color: #f5f8ff; }
.cg-detail h2 { font-size: 20px; margin: 10px 0 6px; }
.cg-detail dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 12px 0; }
.cg-detail dt { color: #a9bed2; }
.cg-detail dd { margin: 0; }
.cg-detail p { white-space: pre-wrap; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .cg-dash { grid-template-columns: 1fr 1fr; grid-template-rows: auto; grid-template-areas: "feed map" "latest latest" "audio actions" "sources sources"; }
  .cg-side { display: contents; }
  .cg-feed { max-height: 640px; }
  .cg-map { min-height: 520px; }
  .cg-side > #cgAudio { grid-area: audio; } .cg-side > #cgActions { grid-area: actions; } .cg-side > #cgSources { grid-area: sources; }
  .cg-hero { grid-template-columns: minmax(130px, 28%) 1fr; }
  .cg-hero-room { position: absolute; inset: 0 0 0 40%; opacity: .3; }
  .cg-hero-brand { display: none; }
}
@media (max-width: 720px) {
  .cg-dash { grid-template-columns: 1fr; grid-template-areas: "feed" "map" "audio" "actions" "latest" "sources"; }
  .cg-feed { max-height: 74vh; }
  .cg-map { min-height: 440px; }
  .cg-hero { grid-template-columns: 34% 1fr; min-height: 190px; }
  .cg-hero-portrait { min-height: 190px; }
  .cg-hero-copy { padding: 14px 12px 12px 4px; gap: 6px; }
  .cg-hero-copy h1 { font-size: clamp(22px, 8vw, 34px); }
  .cg-hero-tag { font-size: 10px; letter-spacing: .03em; }
  .cg-search { flex-wrap: wrap; }
  .cg-search select { flex: 1 1 100%; }
  .cg-foot .r { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .cg *, .cg *::before, .cg *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

.cg-mapnote { position: absolute; left: 10px; top: 10px; right: 64px; z-index: 500; font-size: 12px; padding: 6px 10px; border-radius: 8px; background: rgba(4,23,41,.92); border: 1px solid var(--cg-line); color: var(--cg-muted); margin: 0; }
.cg-mapnote[hidden] { display: none; }

<div class="cg-dash">
  <section class="cg-panel cg-feed" id="cgFeed" aria-labelledby="cgFeedH" aria-busy="true">
    <div class="cg-ph"><div class="cg-ph-l"><span id="cgFeedPill">${pill()}</span><h2 id="cgFeedH">Incident Feed</h2></div>
      <div class="cg-feed-tools"><button class="cg-sw" id="cgAuto" role="switch" aria-checked="${P.auto}"><span>Auto refresh</span><span class="tr"></span></button>
      <button class="cg-iconbtn" id="cgRefresh" aria-label="Refresh now" title="Refresh now">${ico('refresh')}</button></div></div>
    <p class="cg-stamp" id="cgStamp" style="margin:-4px 0 8px">Waiting for first update&hellip;</p>
    <div class="cg-chips" id="cgChips" role="group" aria-label="Filter by category">${['All', 'Police', 'Fire', 'EMS', 'Traffic', 'Weather', 'Community'].map(c =>
      `<button class="cg-chip" data-cat="${c}" aria-pressed="${c === 'All'}">${c === 'All' ? '' : `<span style="color:${CAT[c].hex}">${ico(CAT[c].icon)}</span>`}${c}</button>`).join('')}</div>
    <div class="cg-search"><input id="cgQ" type="search" placeholder="Search incidents" aria-label="Search incidents" autocomplete="off">
      <select id="cgZone" aria-label="Coverage area"><option value="">All zones</option>${Object.keys(ZONE_CENTER).map(z => `<option>${esc(z)}</option>`).join('')}</select></div>
    <ul class="cg-list" id="cgList" aria-label="Incidents"></ul>
  </section>
  <section class="cg-panel cg-map" id="cgMapPanel" aria-labelledby="cgMapH">
    <div class="cg-ph"><h2 id="cgMapH">Live Incident Map</h2><button class="cg-iconbtn" id="cgFull" aria-label="Full screen map" title="Full screen" hidden>${ico('expand')}</button></div>
    <div class="cg-map-box" id="cgMapBox"><div class="cg-leaf" id="cgLeaf"></div><p class="cg-mapnote" id="cgMapNote" hidden>These reports have no map coordinates, so they are listed in the feed and not plotted at a guessed position.</p><div class="cg-fb" id="cgFb" hidden></div>
      <div class="cg-zoom"><button id="cgZin" aria-label="Zoom in" disabled>${ico('plus')}</button><button id="cgZout" aria-label="Zoom out" disabled>${ico('minus')}</button><button id="cgReset" aria-label="Reset map view" title="Reset map view" disabled>${ico('reset')}</button></div></div>
    <div class="cg-legend" id="cgLegend">${['Police', 'Fire', 'EMS', 'Traffic', 'Weather'].map(c => `<span><i style="--c:${CAT[c].c}">${ico(CAT[c].icon)}</i>${c}</span>`).join('')}<span class="mapped" id="cgMapped"></span></div>
  </section>
  <div class="cg-side">
    <section class="cg-panel" id="cgAudio" aria-labelledby="cgAudH">
      <div class="cg-ph" style="margin-bottom:8px"><h2 id="cgAudH">Live Scanner Audio</h2></div>
      <div class="cg-audio-st"><span class="cg-onair" id="cgOnAir" data-s="none">Not connected</span><span class="cg-dotg" id="cgAudMsg" data-s="none"></span></div>
      <a class="cg-btn sec" id="cgListen" target="_blank" rel="noopener noreferrer" hidden style="margin-bottom:10px;text-align:center"></a>
      <div class="cg-wave-wrap"><canvas class="cg-wave" id="cgWave" width="600" height="128" role="img" aria-label="Audio level display"></canvas><span class="cg-wave-msg" id="cgWaveMsg"></span></div>
      <div class="cg-player"><button class="cg-play" id="cgPlay" aria-label="Play scanner audio" disabled>${ico('play')}</button>
        <button class="cg-iconbtn" id="cgMute" aria-label="Mute" aria-pressed="${P.muted}">${ico(P.muted ? 'mute' : 'vol')}</button>
        <input id="cgVol" type="range" min="0" max="100" value="${Math.round(P.vol * 100)}" aria-label="Volume"></div>
      <h3 class="cg-sub">Sound Controls</h3>
      ${sw('alerts', 'Alerts', 'On-screen notice when a new report arrives')}
      ${sw('voice', 'Voice announcements', 'Synthesized voice on this device')}
      ${sw('music', 'Background music', 'No music source is configured', true)}
      ${sw('announce', 'Auto announce new incidents', 'Needs voice announcements on')}
      <div class="cg-speak"><button class="cg-btn" id="cgSay">${ico('mic')}Announce latest incident</button><button class="cg-btn sec" id="cgStop" disabled>Stop</button></div>
      <p class="cg-voice-note">Announcements use your device&rsquo;s synthesized voice and the report text shown here. They are not live radio and not an official dispatch.</p>
    </section>
    <section class="cg-panel" id="cgActions" aria-labelledby="cgQaH"><h2 id="cgQaH">Quick Actions</h2>
      <div class="cg-qa"><button class="cg-btn ann" id="cgAnn">${ico('mic')}Make an Announcement</button><button class="cg-btn add" id="cgAdd">${ico('plus')}Add New Report</button>
      <button class="cg-btn sec wide" id="cgDesk">${ico('edit')}Open Publishing Desk</button></div><p class="cg-auth" id="cgAuthNote"></p></section>
    <section class="cg-panel" id="cgSources" aria-labelledby="cgSrcH"><h2 id="cgSrcH" style="margin-bottom:10px">Public Information Sources</h2>
      <div class="cg-srcs">${SOURCES.map(s => `<a class="cg-src" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><b>${esc(s.name)}</b><span>${esc(s.sub)}</span></a>`).join('')}</div>
      <p class="cg-voice-note">External sites. Not 423.news partners.</p>
      <div class="cg-priv" style="margin-top:12px">${ico('shield')}<p>${N().readOnly ? 'Reports here follow the desk scanner policy: no names and no street numbers. This is not an emergency service: call 911.' : 'Police report locations are shown without house numbers. Do not send names, phone numbers or home addresses. This is not an emergency service: call 911.'}</p></div></section>
  </div>

      n.fld('location', 'Location / cross streets', 'required minlength="3" maxlength="140"') + n.fld('units', 'Responding units (optional)', 'maxlength="200"') +
      n.fld('lat', 'Latitude (optional)', 'inputmode="decimal"') + n.fld('lng', 'Longitude (optional)', 'inputmode="decimal"') +
      '<label>Details<textarea name="details" rows="4" required minlength="10" maxlength="1500"></textarea></label><p class="muted">Leave out names, phone numbers and home addresses.</p>',
      async f => { const r = await n.api('/wire', n.J('POST', f)); if (r && r.item) S.seen.add(String(r.item.id)); n.closeM(); n.toast('Wire report published.'); refresh(); }, 'Publish report');
  } else {
    n.form('Send a tip to the newsroom',
      n.fld('headline', 'What happened?', 'required minlength="5" maxlength="120"') + n.fld('location', 'Where (street or area)', 'required minlength="3" maxlength="140"') +
      '<label>Details<textarea name="details" rows="4" required minlength="20" maxlength="1500"></textarea></label><p class="muted">Tips are reviewed by editors before anything is published. Leave out names, phone numbers and home addresses. In an emergency, call 911.</p>',
      async f => {
        const r = await n.api('/posts', n.J('POST', { category: 'Live', title: 'Tip: ' + f.headline, summary: f.location, body: `Location: ${f.location}\n\n${f.details}` }));
        n.closeM(); n.toast(r.notice || 'Tip submitted for review.');
      }, 'Send tip');
  }
}
function openDesk() {
  const n = N(); if (n.deskUrl) { location.href = n.deskUrl; return; }
  if (needsAuth()) return;
  if (n.canWire()) { location.hash = '#/wire'; } else n.toast('The publishing desk is limited to approved press and admin accounts.');
}

/* ---------- weather chip (National Weather Service, same source the home page uses) ---------- */
async function loadWeather() {
  try {
    const p = await (await fetch('https://api.weather.gov/points/35.0456,-85.3097')).json();
    const f = await (await fetch(p.properties.forecastHourly)).json(), per = f.properties.periods[0];
    if (!S || !S.mounted) return;
    const el = $('#cgWx', S.root); el.textContent = `Chattanooga, TN \u00b7 ${per.temperature}\u00b0${per.temperatureUnit || 'F'}`; el.hidden = false;
  } catch { /* weather is optional */ }
}

/* ---------- events ---------- */
function bind() {
  const R = S.root, ac = S.ac = new AbortController(), sig = { signal: ac.signal };
  R.addEventListener('click', e => {
    const t = e.target.closest('button,a'); if (!t || !R.contains(t)) return;
    const d = t.dataset;
    if (d.open !== undefined) { e.preventDefault(); return openDetail(d.open, t); }
    if (d.pick !== undefined) return select(d.pick, { fromList: true });
    if (d.fbpin !== undefined) return select(d.fbpin, { fromMap: true });
    if (d.cat !== undefined) { S.cat = d.cat; $$('.cg-chip', R).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.cat === S.cat))); renderFeed(); renderMap(true); renderCards(); return; }
    if (d.pref !== undefined) {
      if (t.getAttribute('aria-disabled') === 'true') { if (d.pref === 'announce') N().toast('Turn on Voice announcements first.'); return; }
      P[d.pref] = !P[d.pref]; t.setAttribute('aria-checked', String(P[d.pref]));
      if (d.pref === 'voice' && !P.voice) { P.announce = false; if (canSpeak()) speechSynthesis.cancel(); }
      if (d.pref === 'voice' && P.voice && !canSpeak()) N().toast('This browser has no speech synthesis. Voice announcements will not play.');
      savePrefs(); renderAudio(); return;
    }
    switch (t.id) {
      case 'cgAuto': P.auto = !P.auto; t.setAttribute('aria-checked', String(P.auto)); savePrefs(); renderAll(); if (P.auto) refresh(); break;
      case 'cgRefresh': case 'cgRetry': refresh(); break;
      case 'cgClear': S.q = ''; S.cat = 'All'; S.zone = ''; $('#cgQ', R).value = ''; $('#cgZone', R).value = ''; $$('.cg-chip', R).forEach(c => c.setAttribute('aria-pressed', String(c.dataset.cat === 'All'))); renderAll(); renderMap(true); break;
      case 'cgDemoOn': S.demoOn = true; S.demoOff = false; refresh(); break;
      case 'cgHideDemo': S.demoOn = false; S.demoOff = true; S.items = []; refresh(); break;
      case 'cgZin': S.map && S.map.zoomIn(); break;
      case 'cgZout': S.map && S.map.zoomOut(); break;
      case 'cgReset': fitAll(); break;
      case 'cgFull': (document.fullscreenElement ? document.exitFullscreen() : $('#cgMapPanel', R).requestFullscreen()).catch(() => {}); break;
      case 'cgPlay': togglePlay(); break;
      case 'cgMute': P.muted = !P.muted; savePrefs(); applyVolume(); if (P.muted && canSpeak()) speechSynthesis.cancel(); break;
      case 'cgSay': { const i = S.items.find(x => x.status !== 'resolved') || S.items[0]; if (!i) N().toast('No incidents to announce yet.'); else speak(announceText(i)); break; }
      case 'cgStop': if (canSpeak()) speechSynthesis.cancel(); S.speaking = false; t.disabled = true; break;
      case 'cgAnn': announcementForm(); break;
      case 'cgAdd': reportForm(); break;
      case 'cgDesk': openDesk(); break;
    }
  }, sig);
  let qt; $('#cgQ', R).addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; renderFeed(); renderMap(true); renderCards(); }, 150); }, sig);
  $('#cgZone', R).addEventListener('change', e => { S.zone = e.target.value; renderFeed(); renderMap(); renderCards(); fitAll(); }, sig);
  $('#cgVol', R).addEventListener('input', e => { P.vol = Number(e.target.value) / 100; if (P.vol > 0) P.muted = false; savePrefs(); applyVolume(); }, sig);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && P.auto && S.mounted) refresh(); }, sig);
  window.addEventListener('online', () => refresh(), sig);
  window.addEventListener('offline', () => { S.status = 'offline'; S.err = 'You are offline. Showing the last reports received.'; renderAll(); }, sig);
  document.addEventListener('fullscreenchange', () => { if (S.map) setTimeout(() => S.map.invalidateSize(), 150); }, sig);
  if (document.fullscreenEnabled) $('#cgFull', R).hidden = false;
}

/* ---------- lifecycle (called by the site router) ---------- */
async function mount(hash) {
  leave(); S = fresh(); S.mounted = true;
  const n = N(), root = S.root = n.app();
  root.innerHTML = template(); document.body.classList.add('cg-page');
  document.title = 'Claudia Green Live Scanner Wire \u2022 423.news';
  bind(); applyVolume(); drawIdle(); watchModal();
  if (n.noZones) $('#cgZone', root).hidden = true;
  S.pendingHash = hash || '';
  const cfgP = n.api('/scanner/config').then(c => { S.cfg = Object.assign({}, c, window.CLAUDIA_CONFIG || {}); }).catch(() => { S.cfg = Object.assign({}, window.CLAUDIA_CONFIG || {}); });
  await Promise.all([cfgP, refresh()]);
  renderAudio(); initMap(); loadWeather();
  S.timer = setInterval(() => { if (P.auto && !document.hidden) refresh(); }, REFRESH_MS);
}
function leave() {
  if (!S) return;
  clearInterval(S.timer); stopWave();
  if (S.el) { try { S.el.pause(); S.el.removeAttribute('src'); S.el.load(); } catch { /* ignore */ } }
  if (S.ctx) { try { S.ctx.close(); } catch { /* ignore */ } }
  if (S.map) { try { S.map.remove(); } catch { /* ignore */ } }
  if (S.mo) S.mo.disconnect();
  if (S.ac) S.ac.abort();
  if (canSpeak()) speechSynthesis.cancel();
  document.body.classList.remove('cg-page');
  S.mounted = false; S = null;
}
function active() { return !!(S && S.mounted && S.root && S.root.isConnected && S.root.querySelector('.cg')); }
// Same-page navigation (hash change or sign-in): keep audio and map alive, just sync the view.
function hash(a) { if (!active()) return; renderAuthNote(); renderAudio(); if (a) { if (S.items.length) openDetail(a); else S.pendingHash = a; } }

window.Claudia = { mount, leave, active, hash };
})();

</script>
