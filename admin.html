function b64(blob){return new Promise(function(ok,no){var f=new FileReader();f.onload=function(){ok(String(f.result).split(',')[1])};f.onerror=no;f.readAsDataURL(blob)})}
function prepImage(file){ /* returns {type,data}; shrinks big photos so they upload from a phone */
  var MAX=3*1024*1024-60000;
  if(file.type==='image/gif'){return file.size>MAX?Promise.reject('GIF is over 3 MB. Use a smaller one.'):b64(file).then(function(d){return{type:'image/gif',data:d}})}
  return new Promise(function(ok,no){var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,1600/w),c=document.createElement('canvas');
      c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      var type=file.type==='image/png'?'image/png':'image/jpeg';
      c.toBlob(function(bl){if(!bl)return no('Could not read that image.');
        if(bl.size>MAX&&type==='image/png'){type='image/jpeg';return c.toBlob(function(b2){b2&&b2.size<=MAX?b64(b2).then(function(d){ok({type:type,data:d})}):no('Image is too large.')},type,.85)}
        if(bl.size>MAX)return no('Image is too large.');
        b64(bl).then(function(d){ok({type:type,data:d})})},type,.88)};
    img.onerror=function(){URL.revokeObjectURL(u);no('That file is not an image I can read.')};img.src=u})}

  p.innerHTML=$('adkind').value==='video'?'<video src="'+esc(u)+'" autoplay muted loop playsinline controls style="'+st+'"></video>':'<img src="'+esc(u)+'" alt="" style="'+st+'">'}

  f.accept=v?'video/mp4,video/webm':'image/jpeg,image/png,image/webp,image/gif';

function putFile(file){ /* big files go straight to storage through a one-time URL */
  return call('adUploadUrl',{type:file.type,size:file.size}).then(function(r){
    if(r.s!==200||!r.j.uploadUrl)throw (r.j.error==='size'?'That video is over 25 MB.':r.j.error==='type'?'Use an MP4 or WebM file.':'Could not start the upload.');
    var fd=new FormData();fd.append('cacheControl','3600');fd.append('',file);
    return fetch(r.j.uploadUrl,{method:'PUT',headers:{'x-upsert':'false'},body:fd}).then(function(u){if(!u.ok)throw 'Upload failed. Try a smaller or different file.';return r.j.url})})}
function adForm(r){r=r||{};return'<div class="card"><b id="adhead">'+(r.id?'Edit ad':'New ad')+'</b><div id="msg"></div>'+

      '<small>'+((a.pages||'all')==='all'?'all pages':'pages: '+esc(a.pages))+' · '+(a.max_width?a.max_width+'px wide':'full width')+' · '+(a.height?a.height+'px tall':'auto height')+' · '+a.seconds+'s'+(a.starts_at?' · from '+esc(new Date(a.starts_at).toLocaleString()):'')+(a.ends_at?' · until '+esc(new Date(a.ends_at).toLocaleString()):'')+'</small>'+
      '<div class="act"><button data-ae="1">Edit</button><button class="g" data-ap="1">'+(a.active?'Pause':'Resume')+'</button><button class="d" data-ad="1">Delete</button></div></div>'}).join(''):'<div class="card"><small>No ads yet. Add one above. Until then each slot shows "Your ad here".</small></div>';
    L.onclick=function(e){var c=e.target.closest('.card');if(!c||c.getAttribute('data-i')==null)return;var a=adRows[+c.getAttribute('data-i')];
      if(e.target.getAttribute('data-ae')){adEdit=a;drawAds();window.scrollTo(0,0)}
      else if(e.target.getAttribute('data-ap')){call('update',{table:'news_ads',id:a.id,patch:{active:!a.active}}).then(function(){drawAds()})}
      else if(e.target.getAttribute('data-ad')){if(confirm('Delete this ad and its file permanently?'))call('delete',{table:'news_ads',id:a.id}).then(function(r){if(r.s===200)call('deleteFile',{url:a.image_url});say(r.s===200?'Deleted.':'Could not delete.');drawAds()})}}})}
var adRows=[];
function load(){
  document.getElementById('body').innerHTML='<input id="q" placeholder="Search '+esc(cur)+'" value="'+esc(q)+'"><button id="add">+ Add new</button><div id="addbox"></div><div id="rows">Loading…</div>';
  document.getElementById('q').oninput=function(e){q=e.target.value;paint()};
  document.getElementById('add').onclick=function(){if(NOADD[cur]){say(NOADD[cur]);return}var t=Object.assign({},TPL[cur]||(rows[0]?rows[0]:{}));delete t.id;delete t.created_at;
    var bx=document.getElementById('addbox');bx.innerHTML='<div class="card"><textarea>'+esc(JSON.stringify(t,null,2))+'</textarea><button id="adds">Add</button><button class="g" id="addc">Cancel</button></div>';
    document.getElementById('addc').onclick=function(){bx.innerHTML=''};
    document.getElementById('adds').onclick=function(){var p;try{p=JSON.parse(bx.querySelector('textarea').value)}catch(x){return say('That is not valid JSON.')}
      call('insert',{table:cur,row:p}).then(function(r){say(r.s===200?'Added.':'Could not add. Check the fields.');if(r.s===200)load()})}};
  call('list',{table:cur}).then(function(r){if(r.s!==200){document.getElementById('rows').textContent='Could not load this table.';return}rows=r.j.rows||[];paint()})}
function media(row){var h='';Object.keys(row).forEach(function(k){var v=row[k];if(typeof v!=='string')return;
  var im=/^https:\/\/\S+\.(jpe?g|png|gif|webp)(\?\S*)?$/i.test(v),vd=/^https:\/\/\S+\.(mp4|webm|mov)(\?\S*)?$/i.test(v);if(!im&&!vd)return;
  h+=im?'<img src="'+esc(v)+'" alt="" loading="lazy">':'<video src="'+esc(v)+'" controls preload="none"></video>';
  if(v.indexOf('/storage/v1/object/public/')>-1)h+='<button class="d" data-df="'+esc(k)+'">Delete '+(im?'photo':'video')+' file</button>'});return h}
function paint(){
  var list=rows.filter(function(r){return!q||JSON.stringify(r).toLowerCase().indexOf(q.toLowerCase())>-1}).slice(0,100);
  document.getElementById('rows').innerHTML=list.map(function(r){var title=r.title||r.name||r.username||r.display_name||r.email||r.id;
    return'<div class="card" data-id="'+esc(r.id)+'"><b>'+esc(title)+'</b><br><small>'+esc(JSON.stringify(r).slice(0,180))+'</small>'+media(r)+'<div class="act"><button data-e="1">Edit</button><button class="d" data-x="1">Delete</button>'+(cur==='news_profiles'?'<button class="d" data-du="1">Remove account</button>':'')+'</div></div>'}).join('')||'<div class="card">Nothing found.</div>';
  document.getElementById('rows').onclick=function(e){var c=e.target.closest('.card');if(!c)return;var id=c.getAttribute('data-id'),row=rows.filter(function(r){return String(r.id)===id})[0];
    if(e.target.getAttribute('data-x')){if(confirm('Delete this permanently?'))call('delete',{table:cur,id:id}).then(function(r){say(r.s===200?'Deleted.':'Could not delete.');load()})}
    else if(e.target.getAttribute('data-e')){var d=Object.assign({},row);delete d.id;c.querySelector('.act').innerHTML='<textarea>'+esc(JSON.stringify(d,null,2))+'</textarea><button data-s="1">Save</button><button class="g" data-c="1">Cancel</button>'}
    else if(e.target.getAttribute('data-df')){var f=e.target.getAttribute('data-df');if(confirm('Delete this file from storage and clear it from the row?')){var pt={};pt[f]=null;
      call('deleteFile',{url:row[f]}).then(function(r){if(r.s!==200)return say('Could not delete the file.');call('update',{table:cur,id:id,patch:pt}).then(function(){say('File deleted.');load()})})}}
    else if(e.target.getAttribute('data-du')){if(confirm('Remove this account permanently? Their login will stop working.'))call('deleteUser',{id:id}).then(function(r){say(r.s===200?'Account removed.':'Could not remove the account.');load()})}
    else if(e.target.getAttribute('data-c'))paint();
    else if(e.target.getAttribute('data-s')){var p;try{p=JSON.parse(c.querySelector('textarea').value)}catch(x){return say('That is not valid JSON.')}
      call('update',{table:cur,id:id,patch:p}).then(function(r){say(r.s===200?'Saved.':'Could not save.');load()})}}}
if(tok)init();else drawLogin();
