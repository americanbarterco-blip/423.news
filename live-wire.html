        confidence: 'developing',
        tags: ['police'],
        scanner: []
      },
      {
        id: 'seed-3', minutesAgo: 96, kind: 'VERIFIED',
        dateline: 'STATEHOUSE',
        headline: 'Transit authority confirms fare change takes effect next quarter',
        summary: 'Verified against the board agenda and a signed notice posted to the authority website. The change moves the base fare for the first time in four years; public comment closes in three weeks.',
        confidence: 'confirmed',
        tags: ['verified', 'transit', 'policy'],
        scanner: []
      },
      {
        id: 'seed-4', minutesAgo: 165, kind: 'FIELD',
        dateline: 'RIVER DISTRICT',
        headline: 'Flood watch extended as upstream gauges climb past action stage',
        summary: 'Two gauges upstream crossed action stage overnight. Crews are staging pumps at the low crossing. No evacuations ordered. Claudia is watching the 6 a.m. briefing before filing a full report.',
        confidence: 'developing',
        tags: ['weather', 'field'],
        scanner: []
      },
      {
        id: 'seed-5', minutesAgo: 240, kind: 'VERIFIED',
        dateline: '423.NEWS DESK',
        headline: 'City council agenda adds late item on warehouse rezoning',
        summary: 'Agenda published 14 hours before the meeting with a single added item. Documents are consistent across the clerk\'s portal and the public calendar. Hearing is open to comment.',
        confidence: 'confirmed',
        tags: ['verified', 'civic'],
        scanner: []
      }
    ],
    scanner: {
      feeds: [
        { name: 'County Fire — Ops 1', status: 'hot', listeners: 214 },
        { name: 'County Sheriff — Dispatch B', status: 'active', listeners: 96 },
        { name: 'City PD — Channel 2', status: 'active', listeners: 61 },
        { name: 'County EMS — Med 1', status: 'idle', listeners: 12 },
        { name: 'State Patrol — Post 7', status: 'idle', listeners: 7 }
      ],
      log: [
        { minutesAgo: 3, feed: 'FIRE1', text: 'Second alarm requested, 1400 block commercial', grade: 'A' },
        { minutesAgo: 11, feed: 'SO-B', text: 'Unit 21 clearing, report number issued', grade: 'C' },
        { minutesAgo: 26, feed: 'FIRE1', text: 'Ventilation complete, primary search negative', grade: 'A' },
        { minutesAgo: 40, feed: 'PD-2', text: 'Traffic stop, no further, code 4', grade: 'C' },
        { minutesAgo: 58, feed: 'EMS1', text: 'Medic 4 transporting one, priority 2', grade: 'B' }
      ]
    }
  };

  var OVERLAY_KEY = 'claudia.feed.overlay.v1';
  var state = { feed: null, filter: 'ALL', onAir: false };

  /* ---------------- helpers ---------------- */
  function ago(iso) {
    if (iso == null) return 0;
    return Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  }
  function rel(min) {
    if (min < 1) return 'now';
    if (min < 60) return min + 'm';
    var h = Math.floor(min / 60);
    if (h < 24) return h + 'h';
    return Math.floor(h / 24) + 'd';
  }
  function hhmm(d) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function el(sel) { return document.querySelector(sel); }

  function loadOverlay() {
    try { return JSON.parse(localStorage.getItem(OVERLAY_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function saveOverlay(o) {
    try { localStorage.setItem(OVERLAY_KEY, JSON.stringify(o)); } catch (e) {}
  }

  function normalize(feed) {
    var out = JSON.parse(JSON.stringify(feed || SEED));
    out.reports = (out.reports || []).map(function (r, i) {
      var min = r.minutesAgo != null ? r.minutesAgo : ago(r.ts);
      if (r.ts == null) r.ts = new Date(Date.now() - min * 60000).toISOString();
      r.minutesAgo = min;
      r.kind = (r.kind || 'FIELD').toUpperCase();
      r.confidence = (r.confidence || 'developing').toLowerCase();
      r.id = r.id || 'r' + i;
      return r;
    }).sort(function (a, b) { return b.minutesAgo != null && a.minutesAgo != null ? a.minutesAgo - b.minutesAgo : 0; });

    out.scanner = out.scanner || { feeds: [], log: [] };
    (out.scanner.log || []).forEach(function (l) {
      var min = l.minutesAgo != null ? l.minutesAgo : ago(l.ts);
      if (l.ts == null) l.ts = new Date(Date.now() - min * 60000).toISOString();
      l.minutesAgo = min;
    });
    return out;
  }

  function mergeOverlay(feed) {
    var o = loadOverlay();
    if (o.reports && o.reports.length) {
      feed.reports = o.reports.map(function (r) { return normalize({ reports: [r] }).reports[0]; })
        .concat(feed.reports)
        .sort(function (a, b) { return a.minutesAgo - b.minutesAgo; });
    }
    if (o.onAir != null) feed.claudia.on_air = o.onAir;
    if (o.line) feed.claudia.line = o.line;
    return feed;
  }

  /* ---------------- render: ticker ---------------- */
  function renderTicker(feed) {
    var track = el('#tickerTrack');
    if (!track) return;
    var items = feed.reports.slice(0, 8).map(function (r) {
      return '<span class="ticker-item"><span class="t">' + rel(r.minutesAgo).toUpperCase() +
        '</span><b>' + esc(r.headline) + '</b></span>';
    }).join('');
    track.innerHTML = items + items; /* duplicated for seamless loop */
  }

  /* ---------------- render: hero ---------------- */
  function renderHero(feed) {
    var host = el('#hero');
    if (!host) return;
    var top = feed.reports.filter(function (r) { return r.kind === 'BREAKING'; })[0] || feed.reports[0];
    if (!top) { host.innerHTML = '<div class="empty">No live item on the wire.</div>'; return; }
    host.innerHTML =
      '<div class="hero-head">' +
        '<span class="pill ' + (top.kind === 'HEARD' ? 'monitoring' : 'live') + '"><span class="dot"></span>' +
          (top.kind === 'HEARD' ? 'Unconfirmed tip' : 'Live') + '</span>' +
        '<span class="hero-kicker">423.news &middot; <b>' + esc(top.dateline || 'LIVE DESK') + '</b></span>' +
        '<span class="hero-kicker" style="margin-left:auto" data-clock-abs></span>' +
      '</div>' +
      '<h1>' + esc(top.headline) + '</h1>' +
      '<p class="hero-lede">' + esc(top.summary) + '</p>' +
      (top.safety && top.safety.length
        ? '<div class="safety"><div class="safety-h">What it means for you</div><ul>' +
          top.safety.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>'
        : '') +
      '<div class="hero-meta">' +
        '<span class="byline"><span class="avatar">CG</span>Claudia Green &middot; independent correspondent</span>' +
        '<span class="confidence ' + esc(top.confidence) + '">' + esc(top.confidence) + '</span>' +
        '<span>' + rel(top.minutesAgo) + ' ago</span>' +
        (top.heard_on || (top.scanner && top.scanner.length)
          ? '<span style="color:var(--signal)">&#9679; ' + esc(top.heard_on || top.scanner[0]) + '</span>' : '') +
      '</div>';
  }

  /* ---------------- render: stream ---------------- */
  function renderStream(feed) {
    var host = el('#stream');
    if (!host) return;
    var list = feed.reports.filter(function (r) {
      return state.filter === 'ALL' || r.kind === state.filter;
    });
    if (!list.length) { host.innerHTML = '<div class="empty">Nothing filed in this category yet.</div>'; return; }
    host.innerHTML = list.map(function (r) {
      var heard = r.kind === 'HEARD';
      var section = N().sectionForReport ? N().sectionForReport(r) : { key: 'news', label: 'News' };
      return '<article class="report' + (heard ? ' heard' : '') + '">' +
        '<div class="gutter">' +
          '<span class="time">' + rel(r.minutesAgo) + '</span>' +
          '<span class="kind ' + esc(r.kind.toLowerCase()) + '">' + esc(r.kind) + '</span>' +
          '<span class="kind" style="color:var(--muted-2)">' + esc(r.confidence) + '</span>' +
        '</div>' +
        '<div>' +
          (heard ? '<div class="heard-line"><span class="sig">&#9679;</span>Unconfirmed tip &middot; her own account, not a transcript</div>' : '') +
          '<h3>' + esc(r.headline) + '</h3>' +
          '<p>' + esc(r.summary) + '</p>' +
          (r.safety && r.safety.length
            ? '<div class="safety"><div class="safety-h">What it means for you</div><ul>' +
              r.safety.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul></div>'
            : '') +
          (r.uncertain && r.uncertain.length
            ? '<div class="uncertain-line"><b>Still unconfirmed:</b> ' +
              r.uncertain.map(esc).join(' &middot; ') + '</div>'
            : '') +
          '<div class="tags">' +
            '<a class="tag" href="#/' + esc(section.key) + '" aria-label="View ' + esc(section.label) + ' section">' + esc(section.label) + ' section</a>' +
            '<span class="tag hot">' + esc(r.dateline || 'DESK') + '</span>' +
            (r.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('');
    var c = el('#streamCount');
    if (c) c.textContent = list.length + ' item' + (list.length === 1 ? '' : 's');
  }

  /* ---------------- render: scanner ---------------- */
  function renderScanner(feed) {
    var fh = el('#feedList');
    if (fh) {
      fh.innerHTML = feed.scanner.feeds.map(function (f) {
        var hot = f.status === 'hot' || f.status === 'active';
        return '<div class="feed-row">' +
          '<span class="bars' + (hot ? ' hot' : '') + '">' +
            '<i></i><i></i><i></i><i></i><i></i><i></i></span>' +
          '<span class="name">' + esc(f.name) + (/^https:\/\/([a-z0-9-]+\.)*broadcastify\.com\//i.test(f.url || '') ? ' <a href="' + esc(f.url) + '" target="_blank" rel="noopener noreferrer" style="color:#38bdf8;font-weight:700;text-decoration:underline;white-space:nowrap">Listen live</a>' : '') + '</span>' +
          '<span class="cnt">' + (f.listeners != null ? f.listeners : '—') + '</span>' +
        '</div>';
      }).join('');
      animateBars(fh);
    }
    var lh = el('#scanLog');
    if (lh) {
      lh.innerHTML = (feed.scanner.log || []).slice(0, 12).map(function (l) {
        return '<div><span class="lt">' + rel(l.minutesAgo) + '</span>' +
          '<span class="lf">' + esc(l.feed) + '</span>' +
          '<span class="lg grade-' + esc((l.grade || 'c').toLowerCase()) + '">' + esc(l.text) + '</span></div>';
      }).join('') || '<div style="color:var(--muted-2)">No traffic logged.</div>';
    }
  }

  function animateBars(host) {
    var all = host.querySelectorAll('.bars.hot i');
    all.forEach(function (b) {
      var tick = function () {
        b.style.height = (3 + Math.random() * 11).toFixed(1) + 'px';
        b.style.opacity = (0.45 + Math.random() * 0.55).toFixed(2);
        setTimeout(tick, 260 + Math.random() * 700);
      };
      tick();
    });
  }

  /* ---------------- render: status ---------------- */
  function renderStatus(feed) {
    var onAir = !!feed.claudia.on_air;
    document.querySelectorAll('[data-claudia-status]').forEach(function (n) {
      n.className = 'pill ' + (onAir ? 'live' : 'monitoring');
      n.innerHTML = '<span class="dot"></span>' + (onAir ? 'Live now' : 'At her desk');
    });
    document.querySelectorAll('[data-claudia-line]').forEach(function (n) {
      n.textContent = feed.claudia.line || '';
    });
    document.body.setAttribute('data-onair', onAir ? '1' : '0');
  }

  /* ---------------- render: queue (desk page) ---------------- */
  function renderQueue(feed) {
    var host = el('#queue');
    if (!host) return;
    var list = feed.reports.slice(0, 6);
    host.innerHTML = list.map(function (r) {
      var st = r.kind === 'VERIFIED' ? 'filed' : (r.confidence === 'confirmed' ? 'filed' : 'working');
      return '<div class="qitem"><div>' +
        '<div class="h">' + esc(r.headline) + '</div>' +
        '<div class="m">' + esc(r.dateline || 'DESK') + ' &middot; ' + rel(r.minutesAgo) + ' ago &middot; ' + esc(r.kind) + '</div>' +
        '</div><span class="status-tag ' + st + '">' + st + '</span></div>';
    }).join('') || '<div class="empty">Queue empty — monitors clear.</div>';
  }

  function renderMeters(feed) {
    var host = el('#meters');
    if (!host) return;
    var onAir = !!feed.claudia.on_air;
    var open = feed.reports.filter(function (r) { return r.confidence !== 'confirmed'; }).length;
    var m = [
      ['Feed status', onAir ? 'ON AIR' : 'MONITORING', onAir ? 'transmitting' : 'ready to report', true],
      ['Open items', String(open), 'awaiting verification', false]
    ];
    host.innerHTML = m.map(function (x) {
      return '<div class="meter"><div class="k">' + x[0] + '</div>' +
        '<div class="v' + (x[3] ? ' small' : '') + '"' +
        (x[3] ? ' style="color:' + (onAir ? 'var(--live)' : 'var(--signal)') + '"' : '') + '>' +
        esc(x[1]) + '</div><div class="d">' + x[2] + '</div></div>';
    }).join('');
  }

  /* ---------------- typing console ---------------- */
  var typer = { text: '', i: 0, timer: null };
  function typeLine(text) {
    var host = el('#typing');
    if (!host) return;
    if (typer.timer) clearInterval(typer.timer);
    typer.text = text || '';
    typer.i = 0;
    host.innerHTML = '<span class="caret"></span>';
    typer.timer = setInterval(function () {
      typer.i += 2;
      host.innerHTML = esc(typer.text.slice(0, typer.i)) + '<span class="caret"></span>';
      if (typer.i >= typer.text.length) clearInterval(typer.timer);
    }, 22);
  }

  /* ---------------- clocks ---------------- */
  function startClock() {
    var tick = function () {
      var d = new Date();
      document.querySelectorAll('[data-clock]').forEach(function (n) {
        n.textContent = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) +
          ' · ' + hhmm(d) + ' local';
      });
      document.querySelectorAll('[data-clock-abs]').forEach(function (n) {
        n.textContent = hhmm(d) + ' local';
      });
    };
    tick(); setInterval(tick, 1000);
  }

  /* ---------------- public API ---------------- */
  var api = {
    get feed() { return state.feed; },
    refresh: function () { load().then(paint); },
    filter: function (f) {
      state.filter = f;
      document.querySelectorAll('[data-filter]').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute('data-filter') === f);
      });
      if (state.feed) renderStream(state.feed);
    },
    /* the desk "go live" control — also how a human editor can cut in */
    goLive: function () {
      var o = loadOverlay();
      o.onAir = true;
      o.line = 'On air now — reading the ' + (new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })) + ' update.';
      saveOverlay(o);
      api.refresh();
    },
    standDown: function () {
      var o = loadOverlay();
      o.onAir = false;
      o.line = 'Off air. Back at the desk, feeds still open.';
      saveOverlay(o);
      api.refresh();
    },
    /* called by the agent bridge / ingest script to push a report in-page */
    pushReport: function (r) {
      var o = loadOverlay();
      o.reports = (o.reports || []).concat([Object.assign({ ts: new Date().toISOString() }, r)]);
      o.onAir = true;
      saveOverlay(o);
      api.refresh();
    }
  };
  window.ClaudiaFeed = api;

  /* ---------------- boot ---------------- */
  function paint() {
    var feed = mergeOverlay(state.feed);
    renderStatus(feed);
    renderTicker(feed);
    renderHero(feed);
    renderStream(feed);
    renderScanner(feed);
    renderQueue(feed);
    renderMeters(feed);
    var top = feed.reports[0];
    if (top) typeLine(top.summary);
    document.querySelectorAll('[data-updated]').forEach(function (n) {
      n.textContent = 'synced ' + hhmm(new Date());
    });
  }

  function fetchFeed() {
    return fetch('feed.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('no feed'); return r.json(); })
      .catch(function () { return normalize(SEED); });
  }

  function load() {
    var store = window.ClaudiaStore;
    if (store && store.backend === 'supabase') {
      return store.loadFeed()
        .then(normalize)
        .catch(function () { return fetchFeed(); })   // fall back quietly
        .then(function (f) { state.feed = f; return f; });
    }
    return fetchFeed().then(function (f) { state.feed = f; return f; });
  }

  document.addEventListener('DOMContentLoaded', function () {
    startClock();
    load().then(function () {
      paint();
      document.querySelectorAll('[data-filter]').forEach(function (b) {
        b.addEventListener('click', function () { api.filter(b.getAttribute('data-filter')); });
      });

      /* realtime when Supabase is the backend, polling otherwise */
      var store = window.ClaudiaStore;
      var polling = true;
      if (store && store.backend === 'supabase' && store.subscribe) {
        store.subscribe(function () { load().then(paint); });
        window.addEventListener('claudia:realtime', function (e) {
          if (e.detail === 'on') polling = false;   // Realtime took over
        });
      }
      setInterval(function () {
        if (polling) load().then(paint);
      }, 20000);
    });
  });
})();

</script>
<script>
/* ============================================================
   423.news — Claudia Green | live conditions engine
   Weather  : Open-Meteo (no key, CORS-open)
   Alerts   : api.weather.gov (US, no key)
   Geocoding: Open-Meteo geocoding (no key)
   Traffic  : TomTom Traffic incidents (needs key in assets/config.js)
   ------------------------------------------------------------
   Nothing is invented. If a provider is unreachable or unkeyed the
   card says so, and only published alerts are shown as road advisories.
   ============================================================ */
(function () {
  'use strict';

  var CFG = window.CLAUDIA_CONFIG || {};
  var TTL = (CFG.refreshSeconds || 300) * 1000;
  var imperial = (CFG.units || 'imperial') !== 'metric';

  /* ---------------- tiny helpers ---------------- */
  function el(sel) { return document.querySelector(sel); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function num(n, d) {
    if (n == null || isNaN(n)) return '—';
    return (Math.round(n * Math.pow(10, d || 0)) / Math.pow(10, d || 0)).toString();
  }
  function coordKey(lat, lon) { return lat.toFixed(2) + ',' + lon.toFixed(2); }

  function cached(key, producer) {
    var store = {};
    try { store = JSON.parse(sessionStorage.getItem('claudia.cache') || '{}'); } catch (e) {}
    var hit = store[key];
    if (hit && Date.now() - hit.t < TTL) return Promise.resolve(hit.v);
    return producer().then(function (v) {
      store[key] = { t: Date.now(), v: v };
      try { sessionStorage.setItem('claudia.cache', JSON.stringify(store)); } catch (e) {}
      return v;
    });
  }

  function getJSON(url, headers) {
    return fetch(url, { headers: headers || {}, cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(url.split('?')[0] + ' → HTTP ' + r.status);
      return r.json();
    });
  }

  /* ---------------- WMO weather codes ---------------- */
  var WMO = {
    0: ['Clear', '☀'], 1: ['Mainly clear', '☀'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁'],
    45: ['Fog', '≋'], 48: ['Freezing fog', '≋'],
    51: ['Light drizzle', '☂'], 53: ['Drizzle', '☂'], 55: ['Heavy drizzle', '☂'],
    56: ['Freezing drizzle', '☂'], 57: ['Freezing drizzle', '☂'],
    61: ['Light rain', '☂'], 63: ['Rain', '☂'], 65: ['Heavy rain', '☂'],
    66: ['Freezing rain', '☂'], 67: ['Freezing rain', '☂'],
    71: ['Light snow', '❄'], 73: ['Snow', '❄'], 75: ['Heavy snow', '❄'], 77: ['Snow grains', '❄'],
    80: ['Rain showers', '☂'], 81: ['Rain showers', '☂'], 82: ['Violent showers', '☂'],
    85: ['Snow showers', '❄'], 86: ['Heavy snow showers', '❄'],
    95: ['Thunderstorm', '⛈'], 96: ['Thunderstorm, hail', '⛈'], 99: ['Severe thunderstorm', '⛈']
  };
  function codeInfo(c) {
    var pair = WMO[c] || ['—', '·'];
    return { text: pair[0], icon: pair[1] };
  }

  /* ---------------- geocoding ---------------- */
  function geocode(query) {
    var q = String(query || '').trim();
    if (!q) return Promise.reject(new Error('no area given'));

    var m = q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    if (m) {
      var lat = parseFloat(m[1]), lon = parseFloat(m[2]);
      return cached('rev:' + coordKey(lat, lon), function () { return reverse(lat, lon); });
    }

    return cached('geo:' + q.toLowerCase(), function () {
      var url = 'https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=' +
        encodeURIComponent(q);
      return getJSON(url).then(function (d) {
        var r = (d.results || [])[0];
        if (!r) throw new Error('No such place: “' + q + '”');
        return {
          name: r.name,
          admin1: r.admin1 || '',
          country: r.country_code || r.country || '',
          lat: r.latitude,
          lon: r.longitude,
          label: [r.name, r.admin1, r.country_code].filter(Boolean).join(', ')
        };
      });
    });
  }

  /* reverse geocode for "use my location" (Nominatim, best effort) */
  function reverse(lat, lon) {
    var fallback = { name: 'Current location', admin1: '', country: '', lat: lat, lon: lon,
      label: 'Current location (' + num(lat, 2) + ', ' + num(lon, 2) + ')' };
    return getJSON('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&lat=' + lat + '&lon=' + lon)
      .then(function (d) {
        var a = d.address || {};
        var city = a.city || a.town || a.village || a.county || a.state || fallback.name;
        var place = {
          name: city, admin1: a.state || a.county || '', country: a.country_code || '',
          lat: lat, lon: lon,
          label: [city, a.state, (a.country_code || '').toUpperCase()].filter(Boolean).join(', ')
        };
        return place;
      })
      .catch(function () { return fallback; });
  }

  /* ---------------- weather ---------------- */
  function weather(place) {
    return cached('wx:' + coordKey(place.lat, place.lon), function () {
      var p = [
        'latitude=' + place.lat, 'longitude=' + place.lon,
        'current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,visibility,cloud_cover',
        'hourly=precipitation_probability,precipitation,temperature_2m',
        'daily=temperature_2m_max,temperature_2m_min,sunrise,sunset',
        'forecast_days=2', 'timezone=auto'
      ];
      if (imperial) {
        p.push('temperature_unit=fahrenheit', 'wind_speed_unit=mph', 'precipitation_unit=inch');
      }
      return getJSON('https://api.open-meteo.com/v1/forecast?' + p.join('&')).then(function (d) {
        var c = d.current || {};
        var info = codeInfo(c.weather_code);
        var hourly = d.hourly || {};
        var times = hourly.time || [];
        var now = (c.time || '').slice(0, 13);
        var start = Math.max(0, times.findIndex(function (t) { return t.slice(0, 13) >= now; }));
        var next12 = [];
        for (var i = start; i < Math.min(start + 12, times.length); i++) {
          next12.push({
            t: times[i],
            pop: (hourly.precipitation_probability || [])[i],
            mm: (hourly.precipitation || [])[i],
            temp: (hourly.temperature_2m || [])[i]
          });
        }
        return {
          ok: true,
          temp: c.temperature_2m,
          feels: c.apparent_temperature,
          humidity: c.relative_humidity_2m,
          wind: c.wind_speed_10m,
          gust: c.wind_gusts_10m,
          precip: c.precipitation,
          visibility: c.visibility,
          cloud: c.cloud_cover,
          code: c.weather_code,
          text: info.text, icon: info.icon,
          high: ((d.daily || {}).temperature_2m_max || [])[0],
          low: ((d.daily || {}).temperature_2m_min || [])[0],
          sunrise: ((d.daily || {}).sunrise || [])[0],
          sunset: ((d.daily || {}).sunset || [])[0],
          next12: next12,
          observed: c.time,
          units: imperial ? { t: '°F', w: 'mph', p: 'in', v: 'mi' } : { t: '°C', w: 'km/h', p: 'mm', v: 'km' }
        };
      });
    });
  }

  /* ---------------- alerts (NWS, US) ---------------- */
  function alerts(place) {
    var lat = place.lat, lon = place.lon;
    return cached('nws:' + coordKey(lat, lon), function () {
      return getJSON('https://api.weather.gov/alerts/active?point=' + lat + ',' + lon, {
        Accept: 'application/geo+json'
      }).then(function (d) {
        var list = (d.features || []).map(function (f) {
          var p = f.properties || {};
          return {
            event: p.event,
            severity: p.severity,
            urgency: p.urgency,
            headline: p.headline,
            area: p.areaDesc,
            ends: p.ends || p.expires
          };
        });
        return { ok: true, supported: true, list: list };
      }).catch(function (e) {
        return { ok: false, supported: false, list: [], error: String(e.message || e) };
      });
    });
  }

  /* ---------------- traffic (TomTom) ---------------- */
  var TOMTOM_TYPES = {
    0: 'Unknown', 1: 'Accident', 2: 'Fog', 3: 'Dangerous conditions', 4: 'Rain',
    5: 'Ice', 6: 'Jam', 7: 'Lane closed', 8: 'Road closed', 9: 'Road works',
    10: 'Wind', 11: 'Flooding', 14: 'Broken down vehicle'
  };
  var SEVERE_TYPES = { 1: 1, 5: 1, 6: 1, 7: 1, 8: 1, 11: 1 };

  function traffic(place) {
    var tcfg = CFG.traffic || {};
    if (!tcfg.apiKey) {
      return Promise.resolve({ ok: false, configured: false, list: [] });
    }
    var d = (tcfg.radiusKm || 15) / 111;
    var bbox = [place.lon - d, place.lat - d, place.lon + d, place.lat + d].join(',');
    return cached('tt:' + coordKey(place.lat, place.lon), function () {
      return TomTom.incidents(place.lat, place.lon, tcfg.radiusKm || 15, tcfg.apiKey).then(function (items) {
        var list = items.map(function (x) {
          return { type: x.type, text: x.text || x.type, severe: x.severe, delay: x.delay, length: x.length, from: x.from, to: x.to };
        });
        // severe first, then the rest
        list.sort(function (a, b) { return (b.severe ? 1 : 0) - (a.severe ? 1 : 0); });
        return { ok: true, configured: true, list: list.slice(0, tcfg.maxIncidents || 8) };
      }).catch(function (e) {
        return { ok: false, configured: true, list: [], error: String(e.message || e) };
      });
    });
  }

  /* alerts that have road consequences — used when no traffic key exists */
  var ROAD_ALERTS = /flood|ice|icy|snow|winter|wind|fog|storm|hurricane|tornado|heat|fire/i;
  function roadAlerts(alertList) {
    return (alertList || []).filter(function (a) {
      return ROAD_ALERTS.test((a.event || '') + ' ' + (a.headline || ''));
    });
  }

  /* ---------------- bundle ---------------- */
  function bundle(queryOrPlace) {
    var p = (queryOrPlace && typeof queryOrPlace === 'object')
      ? Promise.resolve(queryOrPlace)
      : geocode(queryOrPlace || CFG.defaultArea);

    return p.then(function (place) {
      return Promise.all([
        weather(place).catch(function (e) { return { ok: false, error: String(e.message || e) }; }),
        alerts(place),
        traffic(place)
      ]).then(function (r) {
        return {
          place: place,
          weather: r[0],
          alerts: r[1],
          traffic: r[2],
          roadAlerts: roadAlerts(r[1].list),
          fetched_at: new Date().toISOString()
        };
      });
    });
  }

  /* ---------------- rendering ---------------- */
  function windDir(t) { return t == null ? '—' : num(t, 0); }

  function renderCard(b, opts) {
    opts = opts || {};
    var wx = b.weather || {};
    var alertsList = (b.alerts && b.alerts.list) || [];
    var tfc = b.traffic || {};
    var u = wx.units || { t: '°F', w: 'mph', p: 'in' };

    var headline = wx.ok
      ? '<div class="wx-top">' +
          '<div class="wx-icon">' + esc(wx.icon) + '</div>' +
          '<div>' +
            '<div class="wx-temp">' + num(wx.temp, 0) + '<span>' + u.t + '</span></div>' +
            '<div class="wx-cond">' + esc(wx.text) + ' · feels ' + num(wx.feels, 0) + u.t + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="wx-grid">' +
          '<div><span class="k">Wind</span><span class="v">' + num(wx.wind, 0) + ' ' + u.w +
            (wx.gust != null ? ' <em>g' + num(wx.gust, 0) + '</em>' : '') + '</span></div>' +
          '<div><span class="k">Rain now</span><span class="v">' + num(wx.precip, 2) + ' ' + u.p + '</span></div>' +
          '<div><span class="k">Humidity</span><span class="v">' + num(wx.humidity, 0) + '%</span></div>' +
          '<div><span class="k">Hi / Lo</span><span class="v">' + num(wx.high, 0) + ' / ' + num(wx.low, 0) + '</span></div>' +
        '</div>' +
        (wx.next12 && wx.next12.length
          ? '<div class="wx-hours">' + wx.next12.map(function (h) {
              var pop = h.pop == null ? 0 : h.pop;
              return '<div class="wx-hour" title="' + esc(h.t) + '">' +
                '<i style="height:' + Math.max(3, Math.round(pop * 0.42)) + 'px" class="' + (pop > 60 ? 'hi' : '') + '"></i>' +
                '<span>' + esc(h.t.slice(11, 13)) + '</span></div>';
            }).join('') + '</div>' +
            '<div class="wx-caption">precipitation chance, next 12 hours</div>'
          : '')
      : '<div class="wx-empty">Weather feed unavailable' +
        (wx.error ? ' — ' + esc(wx.error) : '') + '</div>';

    var alertHtml = '';
    if (alertsList.length) {
      alertHtml = '<div class="wx-block">' +
        '<div class="wx-label"><span class="dot-sev"></span>Active alerts · ' + alertsList.length + '</div>' +
        alertsList.slice(0, 4).map(function (a) {
          return '<div class="alert-row">' +
            '<span class="sev ' + esc((a.severity || '').toLowerCase()) + '">' + esc(a.event || 'Alert') + '</span>' +
            '<span class="alert-t">' + esc(a.headline || a.area || '') + '</span></div>';
        }).join('') + '</div>';
    } else if (b.alerts && b.alerts.supported) {
      alertHtml = '<div class="wx-block"><div class="wx-label">Active alerts</div>' +
        '<div class="wx-none">No active NWS alerts for this area.</div></div>';
    } else {
      alertHtml = '<div class="wx-block"><div class="wx-label">Active alerts</div>' +
        '<div class="wx-none">Alert feed covers US locations only.</div></div>';
    }

    var trafficHtml;
    if (tfc.configured && tfc.ok && tfc.list.length) {
      trafficHtml = '<div class="wx-block">' +
        '<div class="wx-label">Traffic incidents · ' + tfc.list.length + '</div>' +
        tfc.list.map(function (t) {
          return '<div class="tfc-row">' +
            '<span class="tfc-type ' + (t.severe ? 'severe' : '') + '">' + esc(t.type) + '</span>' +
            '<span class="tfc-text">' + esc(t.text) + '</span></div>';
        }).join('') + '</div>';
    } else if (tfc.configured && tfc.ok && !tfc.list.length) {
      trafficHtml = '<div class="wx-block"><div class="wx-label">Traffic</div>' +
        '<div class="wx-none">No incidents reported in the ' + (CFG.traffic.radiusKm || 15) + ' km search box.</div></div>';
    } else if (tfc.configured && !tfc.ok) {
      trafficHtml = '<div class="wx-block"><div class="wx-label">Traffic</div>' +
        '<div class="wx-none">Traffic provider error — ' + esc(tfc.error || 'unavailable') + '</div></div>';
    } else {
      trafficHtml = '<div class="wx-block"><div class="wx-label">Traffic</div>' +
        '<div class="wx-none">Traffic feed not configured — add a TomTom key in <span class="mono">assets/config.js</span>.' +
        (b.roadAlerts.length
          ? ' Weather-related road advisories from NWS: ' + b.roadAlerts.length + '.'
          : '') +
        '</div></div>';
    }

    return '<div class="wx-card' + (opts.compact ? ' compact' : '') + '">' +
      '<div class="wx-head">' +
        '<span class="wx-place">' + esc(b.place.label) + '</span>' +
        '<span class="wx-when mono">' + esc((wx.observed || '').replace('T', ' ').slice(0, 16)) + '</span>' +
      '</div>' +
      (opts.only === 'traffic' ? '' : headline + alertHtml) +
      (opts.only === 'weather' ? '' : trafficHtml) +
    '</div>';
  }

  /* traffic-only card, for the conditions page */
  function renderTrafficCard(b) {
    var tfc = b.traffic || {};
    var inner;
    if (tfc.configured && tfc.ok && tfc.list.length) {
      inner = tfc.list.map(function (t) {
        return '<div class="tfc-row">' +
          '<span class="tfc-type ' + (t.severe ? 'severe' : '') + '">' + esc(t.type) + '</span>' +
          '<span class="tfc-text">' + esc(t.text) + '</span></div>';
      }).join('');
    } else if (tfc.configured && tfc.ok) {
      inner = '<div class="wx-none">No incidents reported inside the ' +
        (CFG.traffic.radiusKm || 15) + ' km search box.</div>';
    } else if (tfc.configured) {
      inner = '<div class="wx-none">Traffic provider error — ' + esc(tfc.error || 'unavailable') + '</div>';
    } else {
      inner = '<div class="wx-none">Traffic feed not configured. Add a TomTom key in ' +
        '<span class="mono">assets/config.js</span> to plot incidents here.</div>';
    }

    var road = (b.roadAlerts || []).length
      ? '<div class="wx-block"><div class="wx-label"><span class="dot-sev"></span>' +
        'Weather-related road advisories</div>' +
        b.roadAlerts.map(function (a) {
          return '<div class="alert-row"><span class="sev">' + esc(a.event || 'Alert') + '</span>' +
            '<span class="alert-t">' + esc(a.headline || a.area || '') + '</span></div>';
        }).join('') + '</div>'
      : '';

    return '<div class="wx-card">' +
      '<div class="wx-head"><span>Traffic</span>' +
        '<span class="wx-when mono">' + esc(b.place.label) + '</span></div>' +
      '<div class="wx-label">Incidents</div>' + inner + road +
    '</div>';
  }

  /* ---------------- public API ---------------- */
  window.ClaudiaConditions = {
    config: CFG,
    geocode: geocode,
    reverse: reverse,
    bundle: bundle,
    weather: weather,
    alerts: alerts,
    traffic: traffic,
    renderCard: renderCard,
    renderTrafficCard: renderTrafficCard,
    codeInfo: codeInfo,
    locate: function () {
      return new Promise(function (resolve, reject) {
        if (!navigator.geolocation) return reject(new Error('Geolocation not available'));
        navigator.geolocation.getCurrentPosition(function (pos) {
          resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude });
        }, function (err) { reject(new Error(err.message || 'location denied')); },
        { timeout: 8000, maximumAge: 120000 });
      });
    }
  };
})();

</script>
<script>
/* ============================================================
   423.news — Claudia Green | live crime radar
   ------------------------------------------------------------
   Two sources, both honest:
     1. City open data (Socrata) — real coordinates, when configured
     2. Claudia's own desk feed — reports and unconfirmed tips
        that have no coordinates are listed under the scope, never
        plotted at a made-up position.
   ============================================================ */
(function () {
  'use strict';

  var CFG = window.CLAUDIA_CONFIG || {};
  var RCFG = CFG.radar || {};
  var RADIUS_KM = RCFG.radiusKm || 8;
  var LOOKBACK_DAYS = RCFG.lookbackDays || 7;
  var timers = {};

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function kmToUnit(km) {
    return (CFG.units || 'imperial') === 'metric' ? km : km * 0.621371;
  }
  function unitLabel() { return (CFG.units || 'imperial') === 'metric' ? 'km' : 'mi'; }
  function fmtDist(km) { return kmToUnit(km).toFixed(kmToUnit(km) < 10 ? 1 : 0); }

  function haversine(a, b, c, d) {
    var R = 6371, toRad = Math.PI / 180;
    var dLat = (c - a) * toRad, dLon = (d - b) * toRad;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(a * toRad) * Math.cos(c * toRad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  function bearing(a, b, c, d) {
    var toRad = Math.PI / 180;
    var y = Math.sin((d - b) * toRad) * Math.cos(c * toRad);
    var x = Math.cos(a * toRad) * Math.sin(c * toRad) -
      Math.sin(a * toRad) * Math.cos(c * toRad) * Math.cos((d - b) * toRad);
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }

  var VIOLENT = /homicide|murder|shoot|assault|robbery|rape|sexual|kidnap|carjack|weapon|battery|arson/i;
  var PROPERTY = /theft|burglar|robbery|stolen|larceny|property|vandal|criminal damage|fraud|shoplift/i;

  function categorize(text) {
    var t = String(text || '');
    if (VIOLENT.test(t)) return 'violent';
    if (PROPERTY.test(t)) return 'property';
    return 'other';
  }

  /* ---------------- source 1: city open data ---------------- */
  function loadOpenData(place) {
    var od = (RCFG.openData || {});
    if (!od.datasetUrl) return Promise.resolve({ ok: false, configured: false, points: [] });

    var url = od.datasetUrl +
      '?$limit=400&$order=' + encodeURIComponent((od.dateField || 'date') + ' DESC');

    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('open data → HTTP ' + r.status);
      return r.json();
    }).then(function (rows) {
      var cutoff = Date.now() - LOOKBACK_DAYS * 86400000;
      var points = [];
      rows.forEach(function (row) {
        var lat = parseFloat(row[od.latField || 'latitude']);
        var lon = parseFloat(row[od.lonField || 'longitude']);
        if (isNaN(lat) || isNaN(lon)) return;
        var when = row[od.dateField || 'date'];
        var whenMs = when ? new Date(when).getTime() : NaN;
        if (!isNaN(whenMs) && whenMs < cutoff) return;
        var dist = haversine(place.lat, place.lon, lat, lon);
        if (dist > RADIUS_KM) return;
        var label = row[od.typeField || 'primary_type'] || row[od.descField || 'description'] || 'Incident';
        points.push({
          title: String(label),
          category: categorize(label),
          distanceKm: dist,
          bearing: bearing(place.lat, place.lon, lat, lon),
          when: when,
          lat: lat, lon: lon,
          source: 'open data'
        });
      });
      points.sort(function (a, b) { return a.distanceKm - b.distanceKm; });
      return { ok: true, configured: true, points: points };
    }).catch(function (e) {
      return { ok: false, configured: true, points: [], error: String(e.message || e) };
    });
  }

  /* ---------------- source 2: the desk feed ---------------- */
  function loadDeskSignals(place) {
    var feed = (window.ClaudiaFeed && window.ClaudiaFeed.feed) || {};
    var points = [], unplotted = [];

    (feed.reports || []).forEach(function (r) {
      var tags = (r.tags || []).join(' ').toLowerCase();
      var scanner = (r.scanner || []).join(' ').toLowerCase();
      var crimeish = /police|crime|sheriff|shoot|robber|burgl|theft|assault|pursuit|arrest|fire|ems/.test(tags + ' ' + scanner);
      if (!crimeish) return;
      var hasCoords = r.lat != null && r.lon != null;
      if (hasCoords) {
        var dist = haversine(place.lat, place.lon, r.lat, r.lon);
        if (dist > RADIUS_KM) return;
        points.push({
          title: r.headline, category: categorize(r.headline + ' ' + tags),
          distanceKm: dist, bearing: bearing(place.lat, place.lon, r.lat, r.lon),
          when: r.ts, lat: r.lat, lon: r.lon, source: 'desk report', id: r.id
        });
      } else {
        unplotted.push({
          title: r.headline, kind: r.kind || 'REPORT',
          confidence: r.confidence || 'developing', when: r.ts, source: (r.scanner || [])[0] || 'desk'
        });
      }
    });

    return { points: points, unplotted: unplotted.slice(0, 10) };
  }

  /* ---------------- scope drawing ---------------- */
  function scope(points, compact) {
    var S = compact ? 250 : 380;
    var c = S / 2, maxR = S / 2 - 18;
    var rings = [0.25, 0.5, 0.75, 1];

    var ringSvg = rings.map(function (f) {
      var r = maxR * f;
      var lbl = fmtDist(RADIUS_KM * f);
      return '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" class="ring"/>' +
        '<text x="' + (c + 4) + '" y="' + (c - r + 10) + '" class="ring-lbl">' + lbl + '</text>';
    }).join('');

    var blips = points.map(function (p, i) {
      var r = (Math.min(p.distanceKm, RADIUS_KM) / RADIUS_KM) * maxR;
      var a = (p.bearing - 90) * Math.PI / 180;
      var x = c + r * Math.cos(a), y = c + r * Math.sin(a);
      var cls = p.category === 'violent' ? 'blip-violent' : (p.category === 'property' ? 'blip-property' : 'blip-other');
      return '<g class="blip ' + cls + '" style="animation-delay:' + (i * 90) + 'ms">' +
        '<title>' + esc(p.title) + ' — ' + fmtDist(p.distanceKm) + ' ' + unitLabel() + '</title>' +
        '<circle cx="' + x + '" cy="' + y + '" r="' + (compact ? 9 : 11) + '" class="blip-halo"/>' +
        '<circle cx="' + x + '" cy="' + y + '" r="' + (compact ? 3.2 : 4) + '" class="blip-dot"/>' +
      '</g>';
    }).join('');

    return '<svg class="scope-svg" viewBox="0 0 ' + S + ' ' + S + '" role="img" aria-label="Crime radar scope">' +
      '<defs>' +
        '<radialGradient id="scopeG" cx="50%" cy="50%" r="50%">' +
          '<stop offset="0%" stop-color="#12251a" stop-opacity=".9"/>' +
          '<stop offset="100%" stop-color="#0a0f14" stop-opacity=".9"/>' +
        '</radialGradient>' +
        '<linearGradient id="sweepG" x1="0" y1="0" x2="1" y2="0">' +
          '<stop offset="0%" stop-color="#35c48a" stop-opacity=".38"/>' +
          '<stop offset="100%" stop-color="#35c48a" stop-opacity="0"/>' +
        '</linearGradient>' +
      '</defs>' +
      '<circle cx="' + c + '" cy="' + c + '" r="' + maxR + '" fill="url(#scopeG)" class="scope-face"/>' +
      ringSvg +
      '<line x1="' + c + '" y1="' + (c - maxR) + '" x2="' + c + '" y2="' + (c + maxR) + '" class="axis"/>' +
      '<line x1="' + (c - maxR) + '" y1="' + c + '" x2="' + (c + maxR) + '" y2="' + c + '" class="axis"/>' +
      '<g class="sweep" style="transform-origin:' + c + 'px ' + c + 'px">' +
        '<path d="M' + c + ' ' + c + ' L' + c + ' ' + (c - maxR) +
          ' A' + maxR + ' ' + maxR + ' 0 0 1 ' + (c + maxR * 0.5) + ' ' + (c - maxR * 0.866) + ' Z" fill="url(#sweepG)"/>' +
      '</g>' +
      blips +
      '<circle cx="' + c + '" cy="' + c + '" r="3" class="home-dot"/>' +
      '<text x="' + c + '" y="14" text-anchor="middle" class="cardinal">N</text>' +
      '<text x="' + (S - 8) + '" y="' + (c + 4) + '" text-anchor="end" class="cardinal">E</text>' +
      '<text x="' + c + '" y="' + (S - 6) + '" text-anchor="middle" class="cardinal">S</text>' +
      '<text x="8" y="' + (c + 4) + '" class="cardinal">W</text>' +
    '</svg>';
  }

  function render(host, place, data, compact) {
    var pts = data.points || [];
    var counts = { violent: 0, property: 0, other: 0 };
    pts.forEach(function (p) { counts[p.category] = (counts[p.category] || 0) + 1; });
    var un = data.unplotted || [];

    var html = '<div class="radar' + (compact ? ' compact' : '') + '">' +
      '<div class="radar-head">' +
        '<span class="pill live"><span class="dot"></span>Live crime radar</span>' +
        '<span class="mono radar-place">' + esc(place.label) + '</span>' +
        '<span class="spacer"></span>' +
        '<span class="mono radar-radius">' + fmtDist(RADIUS_KM) + ' ' + unitLabel() + ' · ' + LOOKBACK_DAYS + 'd</span>' +
      '</div>' +
      '<div class="radar-body">' +
        '<div class="radar-scope">' + scope(pts, compact) + '</div>' +
        '<div class="radar-side">' +
          '<div class="radar-counts">' +
            '<span class="rc violent"><b>' + counts.violent + '</b>violent</span>' +
            '<span class="rc property"><b>' + counts.property + '</b>property</span>' +
            '<span class="rc other"><b>' + counts.other + '</b>other</span>' +
          '</div>' +
          (data.sourceNote ? '<div class="radar-src mono">' + esc(data.sourceNote) + '</div>' : '') +
          (pts.length
            ? '<div class="radar-list">' + pts.slice(0, compact ? 4 : 9).map(function (p) {
                var t = p.when ? new Date(p.when) : null;
                var ago = t && !isNaN(t) ? Math.round((Date.now() - t.getTime()) / 60000) : null;
                var agoTxt = ago == null ? '' : (ago < 60 ? ago + 'm' : Math.round(ago / 60) + 'h');
                return '<div class="radar-item ' + p.category + '">' +
                  '<span class="ri-d">' + fmtDist(p.distanceKm) + '</span>' +
                  '<span class="ri-t">' + esc(p.title) + '</span>' +
                  '<span class="ri-w mono">' + esc(agoTxt) + '</span>' +
                '</div>';
              }).join('') + '</div>'
            : '<div class="radar-none">No geocoded incidents inside the ring. ' +
              (data.configured === false ? 'City open data is not configured.' : '') + '</div>') +
        '</div>' +
      '</div>' +
      (un.length
        ? '<div class="radar-unplotted">' +
            '<div class="radar-label">Live signals without coordinates · from the desk feed</div>' +
            un.map(function (u) {
              return '<div class="un-row"><span class="kind">' + esc(u.kind) + '</span>' +
                '<span class="un-t">' + esc(u.title) + '</span>' +
                '<span class="un-s mono">' + esc(u.source) + '</span></div>';
            }).join('') +
          '</div>'
        : '') +
      '</div>';

    host.innerHTML = html;
  }

  /* ---------------- mount ---------------- */
  function mount(host, opts) {
    if (!host) return;
    opts = opts || {};
    var compact = !!opts.compact;
    host.innerHTML = '<div class="radar-loading mono">sweeping ' + esc(opts.area || '') + '…</div>';

    var cond = window.ClaudiaConditions;
    if (!cond) { host.innerHTML = '<div class="wx-empty">conditions engine not loaded</div>'; return; }

    var id = host.id || 'radar' + Math.random().toString(36).slice(2);
    host.id = id;
    if (timers[id]) clearInterval(timers[id]);

    function load() {
      cond.geocode(opts.area || CFG.defaultArea).then(function (place) {
        return Promise.all([loadOpenData(place), Promise.resolve(loadDeskSignals(place))])
          .then(function (r) {
            var open = r[0], desk = r[1];
            var data = {
              points: open.points.concat(desk.points).sort(function (a, b) { return a.distanceKm - b.distanceKm; }),
              unplotted: desk.unplotted,
              configured: open.configured,
              sourceNote: open.configured
                ? (open.ok ? 'city open data · ' + (open.points.length) + ' rows geo-filtered'
                           : 'open data error — ' + (open.error || ''))
                : 'no open-data endpoint set (assets/config.js → radar.openData)'
            };
            render(host, place, data, compact);
            if (opts.onPlace) opts.onPlace(place, data);
          });
      }).catch(function (e) {
        host.innerHTML = '<div class="wx-empty">' + esc(e.message || e) + '</div>';
      });
    }

    load();
    timers[id] = setInterval(load, (RCFG.refreshSeconds || 90) * 1000);
  }

  window.ClaudiaRadar = { mount: mount };
})();

</script>
<script>
/* ============================================================
   423.news — Claudia Green | command bar (typed or spoken)
   Search the wire, run a live area lookup, or put her on air.
   Injects its own markup into [data-search-host].
   ============================================================ */
(function () {
  'use strict';

  var state = { open: false, results: [], active: 0, listening: false, rec: null };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function hl(text, term) {
    if (!term) return esc(text);
    var re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return esc(text).replace(re, '<mark>$1</mark>');
  }

  /* ---------------- markup ---------------- */
  function build(host) {
    host.innerHTML =
      '<div class="cmd" id="cmdRoot">' +
        '<div class="cmd-field">' +
          '<svg class="cmd-ico" viewBox="0 0 20 20" aria-hidden="true">' +
            '<circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/>' +
            '<path d="M12.8 12.8 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
          '</svg>' +
          '<input id="cmdInput" class="cmd-input" type="text" autocomplete="off" spellcheck="false" ' +
            'placeholder="Search the wire, or ask: weather chattanooga · traffic knoxville · radar kingsport" ' +
            'aria-label="Search or command">' +
          '<button class="mic" id="cmdMic" type="button" title="Speak a command" aria-label="Speak a command">' +
            '<svg viewBox="0 0 20 20" aria-hidden="true">' +
              '<rect x="7.6" y="2.6" width="4.8" height="9" rx="2.4" fill="currentColor"/>' +
              '<path d="M4.6 9.4a5.4 5.4 0 0 0 10.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
              '<path d="M10 14.8V17.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' +
            '</svg>' +
          '</button>' +
          '<span class="cmd-hint mono">/</span>' +
        '</div>' +
        '<div class="cmd-listen" id="cmdListen"><span class="lbars"><i></i><i></i><i></i><i></i><i></i></span>' +
          '<span id="cmdHeard">Listening…</span></div>' +
        '<div class="cmd-panel" id="cmdPanel" hidden></div>' +
      '</div>';
  }

  /* ---------------- search index ---------------- */
  function index(feed) {
    var items = [];
    ((feed && feed.reports) || []).forEach(function (r) {
      items.push({
        type: 'report',
        kind: r.kind,
        title: r.headline,
        body: (r.summary || '') + ' ' + (r.dateline || '') + ' ' + (r.tags || []).join(' '),
        dateline: r.dateline,
        id: r.id,
        ts: r.ts
      });
    });
    return items;
  }

  function search(feed, q) {
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return [];
    var out = [];
    index(feed).forEach(function (it) {
      var hay = (it.title + ' ' + it.body).toLowerCase();
      var score = 0;
      terms.forEach(function (t) {
        if (it.title.toLowerCase().indexOf(t) >= 0) score += 3;
        if (hay.indexOf(t) >= 0) score += 1;
      });
      if (score > 0) out.push({ item: it, score: score });
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return out.slice(0, 9);
  }

  /* ---------------- command parsing ---------------- */
  function parse(q) {
    var s = q.trim();
    var low = s.toLowerCase();
    var m;

    if (/^(live|go live|on air|put her on air)$/.test(low)) return { type: 'live' };
    if (/^(stand down|off air|standdown)$/.test(low)) return { type: 'standdown' };

    if ((m = low.match(/^(?:weather|wx)\b(?:\s+(?:in|for|at))?\s*(.*)$/))) return { type: 'weather', area: m[1] || '' };
    if ((m = low.match(/^(?:traffic|roads?|driving)\b(?:\s+(?:in|for|at))?\s*(.*)$/))) return { type: 'traffic', area: m[1] || '' };
    if ((m = low.match(/^(?:radar|crime|crime radar|incidents?)\b(?:\s+(?:in|for|at|near))?\s*(.*)$/))) return { type: 'radar', area: m[1] || '' };
    if ((m = low.match(/^(?:area|conditions|lookup|look up|scan)\b(?:\s+(?:in|for|at|near))?\s*(.*)$/))) return { type: 'area', area: m[1] || '' };

    return { type: 'search', q: s };
  }

  /* ---------------- panel rendering ---------------- */
  var panel, input;

  function showPanel(html) {
    panel.innerHTML = html;
    panel.hidden = false;
    state.open = true;
    document.body.classList.add('cmd-open');
  }
  function hidePanel() {
    panel.hidden = true;
    state.open = false;
    document.body.classList.remove('cmd-open');
  }

  function areaPlaceholder(kind, area) {
    return '<div class="cmd-answer"><div class="cmd-answer-head">' +
      '<span class="pill monitoring"><span class="dot"></span>' + kind + '</span>' +
      '<span class="mono">' + esc(area) + '</span>' +
      '<span class="spacer"></span><span class="mono spin">working…</span>' +
      '</div><div id="cmdAnswerBody"><div class="cmd-skel"></div></div></div>';
  }

  function runArea(kind, area) {
    var q = area || (window.CLAUDIA_CONFIG || {}).defaultArea || '';
    showPanel(areaPlaceholder(kind.toUpperCase(), q));
    window.ClaudiaConditions.bundle(q).then(function (b) {
      var body = '';
      var C = window.ClaudiaConditions;
      if (kind === 'weather') body = C.renderCard(b, { only: 'weather' });
      else if (kind === 'traffic') body = C.renderTrafficCard(b);
      else body = C.renderCard(b, { only: 'weather' }) + C.renderTrafficCard(b);
      var el = document.getElementById('cmdAnswerBody');
      if (el) {
        el.innerHTML = body +
          '<div class="cmd-actions">' +
          '<a class="btn ghost" href="live-wire.html?area=' + encodeURIComponent(q) + '">Open full conditions page</a>' +
          '</div>';
      }
    }).catch(function (e) {
      var el = document.getElementById('cmdAnswerBody');
      if (el) el.innerHTML = '<div class="wx-empty">' + esc(e.message || e) + '</div>';
    });
  }

  function runRadar(area) {
    var q = area || (window.CLAUDIA_CONFIG || {}).defaultArea || '';
    showPanel(areaPlaceholder('CRIME RADAR', q));
    var body = document.getElementById('cmdAnswerBody');
    if (body) body.innerHTML = '<div id="cmdRadar" class="radar-mini"></div>';
    if (window.ClaudiaRadar) {
      window.ClaudiaRadar.mount(document.getElementById('cmdRadar'), { area: q, compact: true });
    }
  }

  function runSearch(q, feed) {
    var hits = search(feed, q);
    if (!hits.length) {
      showPanel('<div class="cmd-answer"><div class="cmd-answer-head">' +
        '<span class="pill offair"><span class="dot"></span>No match</span>' +
        '<span class="mono">' + esc(q) + '</span></div>' +
        '<div class="cmd-empty">Nothing filed under that. Try <b>area ' + esc(q) + '</b> for a live lookup, ' +
        'or <b>radar ' + esc(q) + '</b> for crime activity.</div>' +
        '<div class="cmd-actions">' +
          '<button class="btn ghost" data-cmd="area ' + esc(q) + '">Live lookup: ' + esc(q) + '</button>' +
        '</div></div>');
      return;
    }
    showPanel('<div class="cmd-answer"><div class="cmd-answer-head">' +
      '<span class="pill monitoring"><span class="dot"></span>' + hits.length + ' hits</span>' +
      '<span class="mono">' + esc(q) + '</span></div>' +
      '<div class="cmd-results">' + hits.map(function (h, i) {
        var it = h.item;
        return '<button class="cmd-row' + (i === 0 ? ' on' : '') + '" data-i="' + i + '">' +
          '<span class="kind ' + esc(String(it.kind || '').toLowerCase().split(' ')[0]) + '">' + esc(it.kind) + '</span>' +
          '<span class="cmd-row-main"><span class="cmd-row-t">' + hl(it.title, q) + '</span>' +
          '<span class="cmd-row-b">' + hl(String(it.body).slice(0, 120), q) + '</span></span>' +
        '</button>';
      }).join('') + '</div></div>');
  }

  function dispatch(q) {
    var cmd = parse(q);
    var feed = window.ClaudiaFeed && window.ClaudiaFeed.feed;
    if (cmd.type === 'live') {
      if (window.ClaudiaFeed) window.ClaudiaFeed.goLive();
      showPanel('<div class="cmd-answer"><div class="cmd-answer-head"><span class="pill live">' +
        '<span class="dot"></span>On air</span></div><div class="cmd-empty">Claudia is live on the desk.</div></div>');
      return;
    }
    if (cmd.type === 'standdown') {
      if (window.ClaudiaFeed) window.ClaudiaFeed.standDown();
      showPanel('<div class="cmd-answer"><div class="cmd-answer-head"><span class="pill monitoring">' +
        '<span class="dot"></span>Off air</span></div><div class="cmd-empty">Back at the desk, feeds open.</div></div>');
      return;
    }
    if (cmd.type === 'radar') return runRadar(cmd.area);
    if (cmd.type === 'area' || cmd.type === 'weather' || cmd.type === 'traffic') return runArea(cmd.type, cmd.area);
    return runSearch(cmd.q, feed);
  }

  /* ---------------- microphone ---------------- */
  function setListening(on, heard) {
    state.listening = on;
    var box = document.getElementById('cmdListen');
    var mic = document.getElementById('cmdMic');
    if (box) box.classList.toggle('on', on);
    if (mic) mic.classList.toggle('on', on);
    var h = document.getElementById('cmdHeard');
    if (h && heard != null) h.textContent = heard || 'Listening…';
  }

  function startMic() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      showPanel('<div class="cmd-answer"><div class="cmd-answer-head"><span class="pill offair">' +
        '<span class="dot"></span>No microphone support</span></div><div class="cmd-empty">' +
        'This browser can\'t do speech recognition. Chrome, Edge and Safari support it — or just type the command.</div></div>');
      return;
    }
    if (state.listening) { if (state.rec) state.rec.stop(); setListening(false); return; }

    var rec = new SR();
    rec.lang = (window.CLAUDIA_CONFIG || {}).micLanguage || 'en-US';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    state.rec = rec;

    rec.onstart = function () { setListening(true, 'Listening…'); input.focus(); };
    rec.onresult = function (ev) {
      var txt = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
      txt = txt.trim();
      input.value = txt;
      setListening(true, txt || 'Listening…');
      if (ev.results[ev.results.length - 1].isFinal) {
        setListening(false);
        dispatch(txt);
      }
    };
    rec.onerror = function (ev) {
      setListening(false);
      if (ev.error === 'no-speech') return;
      showPanel('<div class="cmd-answer"><div class="cmd-answer-head"><span class="pill offair">' +
        '<span class="dot"></span>Mic error</span></div><div class="cmd-empty">' + esc(ev.error) +
        ' — allowing microphone access in the browser fixes most of these.</div></div>');
    };
    rec.onend = function () { setListening(false); };
    try { rec.start(); } catch (e) { setListening(false); }
  }

  /* ---------------- wiring ---------------- */
  function init() {
    var host = document.querySelector('[data-search-host]');
    if (!host) return;
    build(host);
    input = document.getElementById('cmdInput');
    panel = document.getElementById('cmdPanel');

    input.addEventListener('input', function () {
      var q = input.value.trim();
      if (!q) { hidePanel(); return; }
      var cmd = parse(q);
      if (cmd.type === 'search') runSearch(cmd.q, window.ClaudiaFeed && window.ClaudiaFeed.feed);
      else hidePanel();
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var q = input.value.trim();
        if (q) dispatch(q);
      } else if (e.key === 'Escape') {
        hidePanel(); input.blur();
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        var rows = panel ? Array.prototype.slice.call(panel.querySelectorAll('.cmd-row')) : [];
        if (!rows.length) return;
        e.preventDefault();
        state.active = Math.max(0, Math.min(rows.length - 1, state.active + (e.key === 'ArrowDown' ? 1 : -1)));
        rows.forEach(function (r, i) { r.classList.toggle('on', i === state.active); });
      }
    });

    document.getElementById('cmdMic').addEventListener('click', function (e) {
      e.preventDefault();
      startMic();
    });

    panel.addEventListener('click', function (e) {
      var row = e.target.closest('.cmd-row');
      if (row) {

<script>
/* ============================================================
   423.news — Claudia Green | "on air" audio via LiveKit
   ------------------------------------------------------------
   Her voice only. No third-party audio is ever
   restreamed or rebroadcast — LiveKit carries Claudia reading her
   own account, in her own words, which is the whole point.

   Room roles:
     listener   — any visitor: subscribe to her audio
     publisher  — the desk, gated by an editor key

   Config (assets/config.js):
     livekit: { url, tokenEndpoint: '/api/livekit-token', room: 'claudia-desk' }
   ============================================================ */
(function () {
  'use strict';

  var CFG = window.CLAUDIA_CONFIG || {};
  var LK = CFG.livekit || {};
  var state = {
    connected: false,
    listening: false,
    publishing: false,
    room: null,
    track: null,
    live: false
  };
  var mod = null;

  function cfgOk() { return !!(LK.tokenEndpoint && (LK.url || LK.tokenEndpoint)); }

  function loadClient() {
    if (mod) return Promise.resolve(mod);
    return import('https://cdn.jsdelivr.net/npm/livekit-client@2/+esm').then(function (m) {
      mod = m;
      return m;
    });
  }

  function token(role, editorKey) {
    var qs = '?role=' + encodeURIComponent(role) + '&room=' + encodeURIComponent(LK.room || 'claudia-desk');
    var init = { headers: {} };
    if (editorKey) init.headers['x-editor-key'] = editorKey;
    return fetch(LK.tokenEndpoint + qs, init).then(function (r) {
      if (!r.ok) throw new Error('token ' + r.status);
      return r.json();
    });
  }

  /* ---------------- UI ---------------- */
  function bar() { return document.getElementById('onairBar'); }

  function paint() {
    var b = bar();
    if (!b) return;
    b.classList.toggle('on', state.listening || state.publishing);
    b.setAttribute('data-live', state.live ? '1' : '0');
    var label = document.querySelector('#onairBar .oa-label');
    if (label) {
      label.textContent = state.publishing
        ? 'On air — you are transmitting'
        : state.listening ? 'Listening to Claudia'
          : state.live ? 'Claudia is on air' : 'Claudia is at her desk';
    }
    var btn = document.querySelector('#onairBar .oa-btn');
    if (btn) btn.textContent = state.listening ? 'Stop' : 'Listen';
    if (btn) btn.hidden = state.publishing;
  }

  function meter(level) {
    var bars = document.querySelectorAll('#onairBar .oa-meter i');
    for (var i = 0; i < bars.length; i++) {
      bars[i].style.height = Math.max(2, Math.round(level * 14 * (0.5 + Math.random()))) + 'px';
      bars[i].style.opacity = 0.4 + level * 0.6;
    }
  }

  function trackLevel(track) {
    try {
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      var src = audioCtx.createMediaStreamSource(media);
      var an = audioCtx.createAnalyser();

      var buf = new Uint8Array(an.frequencyBinCount);

        if (!state.listening && !state.publishing) return;
        an.getByteFrequencyData(buf);
        var sum = 0;
        for (var i = 0; i < buf.length; i++) sum += buf[i];
        meter(Math.min(1, sum / buf.length / 90));
        requestAnimationFrame(loop);
      };
      loop();
    } catch (e) { /* meter is cosmetic */ }
  }

  /* ---------------- listen ---------------- */
  function listen() {
    if (!cfgOk()) return Promise.reject(new Error('livekit not configured'));
    if (state.listening) return stop();
    if (state.publishing) return Promise.resolve();

    return loadClient().then(function (m) {
      return token('listener').then(function (t) {
        var room = new m.Room({ adaptiveStream: true, dynacast: true });
        state.room = room;
        room.on(m.RoomEvent.TrackSubscribed, function (track) {
          if (track.kind !== m.Track.Kind.Audio) return;
          var el = track.attach();
          el.id = 'onairAudio';
          el.autoplay = true;
          document.body.appendChild(el);
          state.listening = true;
          state.live = true;
          paint();
          trackLevel(track);
        });
        room.on(m.RoomEvent.TrackUnsubscribed, function (track) {
          track.detach().forEach(function (e) { e.remove(); });
          state.listening = false;
          paint();
        });
        room.on(m.RoomEvent.ParticipantConnected, function () {
          state.live = true;
          paint();
        });
        room.on(m.RoomEvent.Disconnected, function () {
          state.connected = false; state.listening = false; paint();
        });
        return room.connect(t.url || LK.url, t.token).then(function () {
          state.connected = true;
          state.live = room.remoteParticipants.size > 0;
          paint();
          return { ok: true };
        });
      });
    });
  }

  /* ---------------- publish (the desk) ---------------- */
  function publish(editorKey) {
    if (!cfgOk()) return Promise.reject(new Error('livekit not configured'));

    return loadClient().then(function (m) {
      return token('publisher', editorKey).then(function (t) {
        var room = new m.Room();
        state.room = room;
        room.on(m.RoomEvent.LocalTrackPublished, function () {
          state.publishing = true; state.live = true; paint();
        });
        room.on(m.RoomEvent.Disconnected, function () {
          state.publishing = false; paint();
        });
        return room.connect(t.url || LK.url, t.token)
          .then(function () { return m.createLocalAudioTrack({ echoCancellation: true, noiseSuppression: true }); })
          .then(function (track) {
            state.track = track;
            return room.localParticipant.publishTrack(track);
          })
          .then(function () {
            state.publishing = true; state.live = true; paint();
            trackLevel(state.track);
            return { ok: true };
          });
      });
    });
  }

  function stop() {
    try {
      if (state.track) state.track.stop();
      if (state.room) state.room.disconnect();
    } catch (e) { /* ignore */ }
    var el = document.getElementById('onairAudio');
    if (el) el.remove();
    state.room = null; state.track = null;
    state.listening = false; state.publishing = false;
    paint();
    return Promise.resolve({ ok: true });
  }

  /* ---------------- probe: is she on air? ---------------- */
  function probe() {
    if (!cfgOk()) return Promise.resolve(false);
    return fetch(LK.tokenEndpoint + '?role=probe&room=' + encodeURIComponent(LK.room || 'claudia-desk'))
      .then(function (r) { return r.ok ? r.json() : { live: false }; })
      .then(function (d) {
        state.live = !!d.live;
        paint();
        return state.live;
      })
      .catch(function () { return false; });
  }

  document.addEventListener('DOMContentLoaded', function () {
    var b = bar();
    if (!b) return;
    b.hidden = !cfgOk();
    paint();
    probe();
    setInterval(probe, 30000);
    var btn = b.querySelector('.oa-btn');
    if (btn) btn.addEventListener('click', function () {
      if (state.listening) stop(); else listen().catch(function (e) { alert(e.message); });
    });

    var desk = document.getElementById('publishBtn');
    var down = document.getElementById('publishStop');
    if (desk) desk.hidden = !cfgOk();
    if (down) down.hidden = !cfgOk();
    if (desk) desk.addEventListener('click', function () {
      if (state.publishing) { stop(); return; }
      var key = prompt('Editor key for the desk microphone:');
      if (!key) return;
      publish(key).then(function () {
        try { localStorage.setItem('claudia.editor', key); } catch (e) {}
      }).catch(function (e) { alert('Could not go live: ' + e.message); });
    });
    var down = document.getElementById('publishStop');
    if (down) down.addEventListener('click', stop);
  });
  window.ClaudiaOnAir = {
    state: state,
    listen: listen,
    publish: publish,
    stop: stop,
    probe: probe,
    configured: cfgOk
  };
})();

</script>

  const d = [
    ['d1', 'Police', 'unverified', 'Traffic stop (demo)', 'Bradley / Cleveland', 'US-11W near Lee Hwy, Cleveland', 'Example entry for previewing the layout.', 35.1595, -84.8766, 6],
    ['d2', 'Fire', 'developing', 'Structure fire (demo)', 'Hamilton / Chattanooga', 'Oak St, Chattanooga', 'Example entry. Units on scene; fire contained to structure.', 35.0721, -85.3374, 10],
    ['d3', 'EMS', 'unverified', 'Medical emergency (demo)', 'Hamilton / Chattanooga', 'I-75 North near Exit 1, Chattanooga', 'Example entry. EMS responding to a medical call.', 35.0083, -85.2411, 18],
    ['d4', 'Police', 'unverified', 'Suspicious vehicle (demo)', 'Hamilton / Chattanooga', 'Signal Mountain Rd, Chattanooga', 'Example entry. Unoccupied vehicle; officers checking.', 35.1113, -85.3301, 25],
    ['d5', 'Traffic', 'verified', 'Minor accident (demo)', 'East Ridge', 'I-24 East near MM 180, Chattanooga', 'Example entry. No injuries; vehicles on shoulder.', 35.0049, -85.2662, 31],
    ['d6', 'Fire', 'resolved', 'Brush fire (demo)', 'Hamilton / Chattanooga', 'Lookout Mountain Rd, Lookout Mountain', 'Example entry. Crews on scene; under control.', 34.9836, -85.3497, 39],
    ['d7', 'Weather', 'verified', 'Flood advisory (demo)', 'Rhea / Dayton', 'Low-lying roads near Dayton', 'Example entry for the Weather category.', 35.4912, -84.9322, 52]
  ];
  return d.map(x => norm({ id: 'demo-' + x[0], category: x[1], status: x[2], headline: x[3], zone: x[4], location: x[5], details: x[6], lat: x[7], lng: x[8], createdAt: t(x[9]) }, true));
}
const sortItems = a => a.sort((x, y) => (N().dt(y.createdAt) - N().dt(x.createdAt)) || String(y.id).localeCompare(String(x.id), undefined, { numeric: true }));

async function refresh() {
  if (!S || S.busy) return;
  S.busy = true; setBusy(true);
  try {
    if (!navigator.onLine) throw Object.assign(new Error('You are offline. Showing the last reports received.'), { offline: true });
    const d = await N().api('/wire?limit=50');
    const map = new Map();
    for (const r of (d && Array.isArray(d.items) ? d.items : [])) { const it = norm(r, false); if (it && !map.has(it.id)) map.set(it.id, it); } // first record per id wins; malformed rows are skipped
    let items = sortItems([...map.values()]);
    S.source = 'live';
    if (!items.length && demoAllowed()) { items = sortItems(demoItems()); S.source = 'demo'; }
    const newOnes = items.filter(i => !S.seen.has(i.id));
    items.forEach(i => S.seen.add(i.id));
    S.items = items; S.status = 'ok'; S.err = ''; S.last = new Date();
    if (!S.firstLoad && S.source === 'live') notifyNew(newOnes.filter(i => i.status !== 'resolved'));
    S.firstLoad = false;
  } catch (e) {
    S.status = e.offline ? 'offline' : 'error'; S.err = e.message || 'Could not load reports.';
  } finally { S.busy = false; setBusy(false); }
  renderAll();
  if (S.pendingHash) { const id = S.pendingHash; S.pendingHash = ''; openDetail(id); }
}
const setBusy = b => { const f = $('#cgFeed', S.root); if (f) f.setAttribute('aria-busy', b ? 'true' : 'false'); const r = $('#cgRefresh', S.root); if (r) r.disabled = b; };

function filtered() {
  const q = S.q.trim().toLowerCase();
  return S.items.filter(i => (S.cat === 'All' || i.category === S.cat) && (!S.zone || i.zone === S.zone) &&
    (!q || (i.headline + ' ' + i.location + ' ' + i.details + ' ' + i.units + ' ' + i.category).toLowerCase().includes(q)));
}

const demoTag = i => i.demo ? '<span class="cg-tag demo">Demo</span>' : '';

const pillState = () => (S.status === 'loading' && !S.items.length) ? 'loading' : S.status === 'offline' ? 'offline' : S.status === 'error' ? 'error' : S.source === 'demo' ? 'demo' : (P.auto ? 'live' : 'paused');

      case 'cgSay': { const i = S.items.find(x => x.status !== 'resolved') || S.items[0]; if (!i) N().toast('No incidents to announce yet.'); else speak(announceText(i)); break; }

  const SB = 'https://kdiwehqtezlhecxsoysj.supabase.co', KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkaXdlaHF0ZXpsaGVjeHNveXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDQzOTEsImV4cCI6MjEwNjIyMDM5MX0.upw9MEq05Gs3czsmnknR1d37I2n3a681XzTJU-MGWwE', FRESH_H = 24, cutoff = Date.now() - FRESH_H * 3600e3;
