<style>
/* ============================================================
   423.news — Claudia Green
   Shared theme for the live homepage and the desk page
   ============================================================ */

:root {
  --ink: #0a0d13;
  --panel: #11151e;
  --panel-2: #161b26;
  --panel-3: #1c2230;
  --line: #232b3a;
  --line-soft: #1a212d;
  --paper: #f3eee4;
  --paper-dim: #c9c3b7;
  --muted: #8590a4;
  --muted-2: #5d6779;
  --live: #e8392f;
  --live-glow: rgba(232, 57, 47, .35);
  --signal: #f5a524;
  --verify: #35c48a;
  --developing: #4d9fff;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r: 10px;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background:
    radial-gradient(1200px 600px at 15% -10%, #16202f 0%, transparent 60%),
    radial-gradient(900px 500px at 95% 0%, #1a1410 0%, transparent 55%),
    var(--ink);
  color: var(--paper);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }

.mono { font-family: var(--mono); }
.wrap { width: min(1280px, 100% - 48px); margin: 0 auto; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 60;
  background: rgba(10, 13, 19, .82);
  backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  display: flex; align-items: center; gap: 18px;
  height: 62px;
}
.brand { display: flex; align-items: baseline; gap: 9px; }
.brand-mark {
  font-family: var(--serif); font-weight: 700; font-size: 22px;
  letter-spacing: -.02em;
}
.brand-mark em { color: var(--live); font-style: normal; }
.brand-sub {
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--muted-2);
}
.nav { display: flex; gap: 22px; margin-left: 18px; }
.nav a {
  font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); padding: 6px 0; border-bottom: 1px solid transparent;
  transition: color .18s, border-color .18s;
}
.nav a:hover { color: var(--paper); border-color: var(--line); }
.nav a.on { color: var(--paper); border-color: var(--live); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.clock {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  letter-spacing: .04em;
}

/* ---------- on-air pill ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase; padding: 6px 11px; border-radius: 999px;
  border: 1px solid currentColor; line-height: 1;
}
.pill.live { color: var(--live); background: rgba(232,57,47,.09); }
.pill.monitoring { color: var(--signal); background: rgba(245,165,36,.08); }
.pill.offair { color: var(--muted-2); }
.pill .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: currentColor; box-shadow: 0 0 0 0 currentColor;
}
.pill.live .dot { animation: pulse 1.7s infinite; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 var(--live-glow); }
  70%  { box-shadow: 0 0 0 9px rgba(232,57,47,0); }
  100% { box-shadow: 0 0 0 0 rgba(232,57,47,0); }
}

/* ---------- ticker ---------- */
.ticker {
  border-bottom: 1px solid var(--line);
  background: linear-gradient(90deg, rgba(232,57,47,.14), rgba(232,57,47,0) 45%), #0d1017;
  overflow: hidden; position: relative;
  display: flex; align-items: center; height: 40px;
}
.ticker-tag {
  flex: none; z-index: 2; display: flex; align-items: center; gap: 8px;
  height: 100%; padding: 0 14px; font-family: var(--mono); font-size: 10.5px;
  letter-spacing: .18em; text-transform: uppercase; color: var(--live);
  background: #0d1017; border-right: 1px solid var(--line);
}
.ticker-track {
  display: flex; gap: 44px; white-space: nowrap;
  animation: slide 48s linear infinite; padding-left: 20px;
}
.ticker:hover .ticker-track { animation-play-state: paused; }
.ticker-item { font-size: 12.5px; color: var(--paper-dim); display: flex; gap: 10px; align-items: center; }
.ticker-item b { color: var(--paper); font-weight: 600; }
.ticker-item .t { font-family: var(--mono); font-size: 10.5px; color: var(--muted-2); }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ---------- layout ---------- */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 352px;
  gap: 30px; padding: 30px 0 70px;
}
@media (max-width: 1040px) { .layout { grid-template-columns: 1fr; } }

/* ---------- live hero ---------- */
.hero {
  border: 1px solid var(--line);
  border-radius: 14px;
  background:
    radial-gradient(700px 260px at 0% 0%, rgba(232,57,47,.10), transparent 70%),
    linear-gradient(180deg, var(--panel-2), var(--panel));
  padding: 26px 28px 24px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; inset: 0 0 auto; height: 2px;
  background: linear-gradient(90deg, var(--live), transparent 65%);
}
.hero-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.hero-kicker {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--muted-2);
}
.hero-kicker b { color: var(--signal); font-weight: 600; }
.hero h1 {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(27px, 3.1vw, 42px); line-height: 1.1;
  letter-spacing: -.022em; margin: 0 0 14px; max-width: 22ch;
}
.hero-lede {
  font-size: 15.5px; line-height: 1.66; color: var(--paper-dim);
  max-width: 62ch; margin: 0 0 20px;
}
.hero-meta {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 11px; color: var(--muted-2);
  border-top: 1px solid var(--line-soft); padding-top: 15px;
}
.byline { display: flex; align-items: center; gap: 9px; color: var(--paper-dim); }
.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(140deg, #7d9b7a, #3f5c46);
  display: grid; place-items: center; font-size: 11px; font-weight: 700;
  color: #0d1310; font-family: var(--sans); letter-spacing: .02em;
  flex: none;
}
.confidence {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .13em;
  text-transform: uppercase; padding: 4px 8px; border-radius: 4px;
  border: 1px solid currentColor;
}
.confidence.confirmed { color: var(--verify); }
.confidence.developing { color: var(--developing); }
.confidence.unconfirmed { color: var(--signal); }

/* ---------- section heads ---------- */
.sec-head {
  display: flex; align-items: baseline; gap: 12px;
  margin: 34px 0 16px;
  border-bottom: 1px solid var(--line); padding-bottom: 11px;
}
.sec-head h2 {
  font-family: var(--sans); font-size: 11.5px; font-weight: 700;
  letter-spacing: .2em; text-transform: uppercase; margin: 0;
}
.sec-head .count { font-family: var(--mono); font-size: 11px; color: var(--muted-2); }
.sec-head .spacer { margin-left: auto; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  font-family: var(--sans); font-size: 11px; letter-spacing: .06em;
  padding: 5px 11px; border-radius: 999px; cursor: pointer;
  transition: all .16s;
}
.chip:hover { color: var(--paper); border-color: var(--muted-2); }
.chip.on { color: var(--ink); background: var(--paper); border-color: var(--paper); font-weight: 600; }

/* ---------- report stream ---------- */
.stream { display: flex; flex-direction: column; gap: 14px; }
.report {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--panel); padding: 18px 20px;
  display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 18px;
  transition: border-color .2s, transform .2s, background .2s;
}
.report:hover { border-color: #2f3a4d; background: var(--panel-2); transform: translateX(2px); }
.report .gutter {
  font-family: var(--mono); font-size: 10.5px; color: var(--muted-2);
  display: flex; flex-direction: column; gap: 7px;
  border-right: 1px solid var(--line-soft); padding-right: 14px;
}
.report .gutter .time { color: var(--paper-dim); font-size: 12px; }
.kind {
  font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; padding: 3px 0; color: var(--muted);
}
.kind.breaking { color: var(--live); }
.kind.scanner { color: var(--signal); }
.kind.field { color: var(--developing); }
.kind.verified { color: var(--verify); }
.report h3 {
  font-family: var(--serif); font-size: 19.5px; line-height: 1.24;
  margin: 0 0 8px; letter-spacing: -.012em; font-weight: 700;
}
.report p { margin: 0 0 10px; font-size: 13.6px; line-height: 1.6; color: var(--paper-dim); }
.report .tags { display: flex; gap: 7px; flex-wrap: wrap; }
.tag {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted-2);
  border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px;
}
.tag.hot { color: var(--live); border-color: rgba(232,57,47,.35); }

/* ---------- heard on the scanner ---------- */
.report.heard { border-left: 2px solid var(--signal); }
.report.heard .gutter { border-right-color: rgba(245,165,36,.18); }
.kind.heard { color: var(--signal); }
.heard-line {
  display: flex; align-items: center; gap: 7px; margin-bottom: 9px;
  font-family: var(--mono); font-size: 9.6px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--signal);
}
.heard-line .sig { font-size: 8px; }
.safety {
  border: 1px solid rgba(245,165,36,.24); background: rgba(245,165,36,.05);
  border-radius: 8px; padding: 11px 13px; margin: 2px 0 11px;
}
.safety-h {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--signal); margin-bottom: 7px;
}
.safety ul { margin: 0; padding-left: 16px; }
.safety li { font-size: 12.6px; line-height: 1.6; color: var(--paper-dim); margin-bottom: 3px; }
.uncertain-line {
  font-size: 12px; line-height: 1.6; color: var(--muted-2); margin-bottom: 10px;
  border-left: 2px solid var(--line); padding-left: 9px;
}
.uncertain-line b { color: var(--signal); font-weight: 600; }

/* ---------- legal strip ---------- */
.legal-strip {
  margin-top: 26px; padding: 13px 15px; border: 1px solid var(--line);
  border-radius: 10px; background: rgba(255,255,255,.015);
  font-size: 11.6px; line-height: 1.7; color: var(--muted-2);
}
.legal-strip b { color: var(--paper-dim); font-weight: 600; }

/* ---------- right rail ---------- */
.rail { display: flex; flex-direction: column; gap: 18px; }
.card {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--panel); overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: 9px;
  padding: 12px 15px; border-bottom: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted);
}
.card-head .spacer { margin-left: auto; }
.card-body { padding: 14px 15px; }

/* desk CTA card */
.desk-cta { position: relative; }
.desk-cta .card-body { padding: 0; }
.desk-viz {
  position: relative; height: 132px; overflow: hidden;
  background: radial-gradient(120% 130% at 50% 0%, #1d2637, #0c1016 70%);
  border-bottom: 1px solid var(--line-soft);
}
.desk-copy { padding: 15px; }
.desk-copy h3 {
  font-family: var(--serif); font-size: 17px; margin: 0 0 6px; letter-spacing: -.01em;
}
.desk-copy p { margin: 0 0 13px; font-size: 12.6px; line-height: 1.55; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 11px 14px; border-radius: 7px; cursor: pointer;
  background: var(--paper); color: #0b0e14; border: 1px solid var(--paper);
  font-family: var(--sans); font-size: 12px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; transition: all .18s;
}
.btn:hover { background: #fff; transform: translateY(-1px); }
.btn.ghost {
  background: transparent; color: var(--paper); border-color: var(--line);
}
.btn.ghost:hover { border-color: var(--muted-2); background: rgba(255,255,255,.03); }
.btn.live-btn { background: var(--live); border-color: var(--live); color: #fff; }
.btn.live-btn:hover { background: #f04a40; }

/* scanner list */
.feed-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--line-soft);
  font-size: 12.5px;
}
.feed-row:last-child { border-bottom: 0; }
.feed-row .name { color: var(--paper-dim); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row .cnt {
  font-family: var(--mono); font-size: 10.5px; color: var(--muted-2);
  font-variant-numeric: tabular-nums;
}
.bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; width: 26px; flex: none; }
.bars i {
  flex: 1; background: var(--signal); border-radius: 1px;
  height: 3px; opacity: .28; transition: height .22s, opacity .22s;
}
.bars.hot i { opacity: .95; }

/* scanner log */
.log {
  font-family: var(--mono); font-size: 11px; line-height: 1.75;
  color: var(--muted); max-height: 250px; overflow-y: auto;
}
.log div { display: flex; gap: 8px; padding: 3px 0; }
.log .lt { color: var(--muted-2); flex: none; }
.log .lf { color: var(--signal); flex: none; }
.log .lg { color: var(--paper-dim); }
.log .grade-a { color: var(--verify); }
.log .grade-b { color: var(--developing); }
.log .grade-c { color: var(--muted-2); }

/* ---------- footer ---------- */
.footer {
  border-top: 1px solid var(--line); padding: 26px 0 44px;
  color: var(--muted-2); font-size: 11.5px; line-height: 1.7;
}
.footer .row { display: flex; gap: 22px; flex-wrap: wrap; justify-content: space-between; }

/* ---------- scrollbar ---------- */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #202836; border-radius: 9px; }
::-webkit-scrollbar-thumb:hover { background: #2c3648; }

/* ============================================================
   DESK PAGE
   ============================================================ */
.desk-hero {
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr);
  gap: 26px; padding: 26px 0 0;
}
@media (max-width: 980px) { .desk-hero { grid-template-columns: 1fr; } }

.stage {
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  background:
    radial-gradient(900px 400px at 50% -20%, #1b2434, transparent 65%),
    linear-gradient(180deg, #0d1218, #090c11);
  position: relative;
}
.stage-in { position: relative; }
.stage-svg { display: block; width: 100%; height: auto; }
.stage-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 3;
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--muted-2);
  background: linear-gradient(180deg, rgba(9,12,17,.9), transparent);
}
.stage-bar .spacer { margin-left: auto; }
.rec {
  display: inline-flex; align-items: center; gap: 6px; color: var(--live);
}
.rec i { width: 6px; height: 6px; border-radius: 50%; background: var(--live);
  animation: recblink 1.4s infinite; }
@keyframes recblink { 0%,100% { opacity: 1; } 50% { opacity: .18; } }

/* live console */
.console {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  display: flex; flex-direction: column; min-height: 100%;
}
.console-head {
  display: flex; align-items: center; gap: 10px; padding: 13px 16px;
  border-bottom: 1px solid var(--line-soft);
}
.console-head .t {
  font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted);
}
.console-body { padding: 20px 18px; flex: 1; }
.typing {
  font-family: var(--serif); font-size: 20px; line-height: 1.5;
  letter-spacing: -.01em; min-height: 120px;
}
.typing .caret {
  display: inline-block; width: 2px; height: 1em; background: var(--signal);
  margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(1) infinite;
}
@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.console-foot {
  border-top: 1px solid var(--line-soft); padding: 13px 16px;
  display: flex; gap: 10px; align-items: center;
}
.console-foot .btn { width: auto; padding: 9px 14px; font-size: 11px; }

/* meter grid */
.meters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.meter {
  border: 1px solid var(--line-soft); border-radius: 8px;
  background: var(--panel-2); padding: 12px;
}
.meter .k {
  font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted-2); margin-bottom: 7px;
}
.meter .v { font-family: var(--serif); font-size: 21px; letter-spacing: -.01em; }
.meter .v.small { font-size: 14px; font-family: var(--mono); }
.meter .d { font-family: var(--mono); font-size: 10px; color: var(--muted-2); margin-top: 4px; }

/* story queue */
.queue { display: flex; flex-direction: column; }
.qitem {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px;
  padding: 12px 15px; border-bottom: 1px solid var(--line-soft);
}
.qitem:last-child { border-bottom: 0; }
.qitem .h { font-size: 13.4px; line-height: 1.42; color: var(--paper-dim); margin-bottom: 5px; }
.qitem .m { font-family: var(--mono); font-size: 9.5px; color: var(--muted-2);
  letter-spacing: .08em; text-transform: uppercase; }
.status-tag {
  font-family: var(--mono); font-size: 9px; letter-spacing: .12em;
  text-transform: uppercase; padding: 4px 7px; border-radius: 4px;
  border: 1px solid currentColor; align-self: start; white-space: nowrap;
}
.status-tag.filed { color: var(--verify); }
.status-tag.working { color: var(--signal); }
.status-tag.watching { color: var(--muted-2); }

.empty {
  padding: 26px 16px; text-align: center; color: var(--muted-2);
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
}

/* ============================================================
   COMMAND BAR (typed or spoken)
   ============================================================ */
.search-slot { flex: 1 1 260px; max-width: 420px; min-width: 130px; }
.cmd { position: relative; width: 100%; }
.cmd-field {
  display: flex; align-items: center; gap: 8px; height: 34px;
  padding: 0 9px 0 11px; border: 1px solid var(--line); border-radius: 8px;
  background: #0d1117; transition: border-color .18s, box-shadow .18s;
}
.cmd-field:focus-within { border-color: var(--signal); box-shadow: 0 0 0 3px rgba(245,165,36,.07); }
.cmd-ico { width: 14px; height: 14px; color: var(--muted-2); flex: none; }
.cmd-input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
  color: var(--paper); font-size: 12.5px; font-family: var(--sans);
}
.cmd-input::placeholder { color: var(--muted-2); }
.mic {
  width: 26px; height: 26px; flex: none; border-radius: 6px; border: 1px solid transparent;
  background: transparent; color: var(--muted); display: grid; place-items: center;
  cursor: pointer; transition: all .16s;
}
.mic svg { width: 15px; height: 15px; }
.mic:hover { color: var(--paper); background: rgba(255,255,255,.05); }
.mic.on {

<script>
/* ============================================================
   423.news — Claudia Green | storage backend
   ------------------------------------------------------------
   Two backends, same shape:
     • supabase  — when CLAUDIA_CONFIG.supabase.url is set.
                   Reads via PostgREST, live updates via Realtime.
     • file      — fallback: feed.json (static host, offline, demo).
   The rest of the site never knows which one is running.
   ============================================================ */
(function () {
  'use strict';

  var CFG = window.CLAUDIA_CONFIG || {};
  var SB = CFG.supabase || {};
  var enabled = !!(SB.url && SB.anonKey);
  var listeners = [];
  var client = null;
  var channel = null;

  function headers(extra) {
    return Object.assign({
      apikey: SB.anonKey,
      Authorization: 'Bearer ' + SB.anonKey,
      'Content-Type': 'application/json'
    }, extra || {});
  }

  function rest(path, query) {
    var url = SB.url.replace(/\/$/, '') + '/rest/v1/' + path + (query ? '?' + query : '');
    return fetch(url, { headers: headers(), cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('supabase ' + path + ' → HTTP ' + r.status);
      return r.json();
    });
  }

  function minutesAgo(ts) {
    var t = ts ? new Date(ts).getTime() : Date.now();
    return Math.max(0, Math.round((Date.now() - t) / 60000));
  }

  /* rows -> the exact feed shape the site renders */
  function shape(rows, feeds, log, meta) {
    var reports = (rows || []).map(function (r) {
      return {
        id: r.id, ts: r.ts, kind: r.kind, dateline: r.dateline,
        confidence: r.confidence, headline: r.headline, summary: r.summary,
        tags: r.tags || [], scanner: r.scanner || [], sources: r.sources || [],
        safety: r.safety || [], uncertain: r.uncertain || [],
        heard_on: r.heard_on, paraphrase: r.paraphrase,
        minutesAgo: minutesAgo(r.ts)
      };
    });

    var online = (feeds || []).some(function (f) { return f.live_data; });

    return {
      generated_at: new Date().toISOString(),
      generator: 'claudia-green/supabase',
      publication: { name: '423.news', role: 'independent correspondent', byline: 'Claudia Green' },
      claudia: {
        status: 'at-desk',
        on_air: !!(meta && meta.on_air),
        line: (meta && meta.line) || 'At the desk, monitors open.'
      },
      reports: reports,
      scanner: {
        provider: '',
        connected: online,
        note: online ? undefined : ((feeds || [])[0] && feeds[0].note) || undefined,
        feeds: (feeds || []).map(function (f) {
          return {
            name: f.name, status: f.status, listeners: f.listeners,
            live_data: f.live_data, priority: f.priority, tags: f.tags || [], url: f.url || ''
          };
        }),
        log: (log || []).map(function (l) {
          return { ts: l.ts, feed: l.feed, text: l.line, grade: l.grade, minutesAgo: minutesAgo(l.ts) };
        })
      }
    };
  }

  function loadSupabase() {
    return Promise.all([
      rest('news_reports', 'select=*&published=eq.true&order=ts.desc&limit=60'),
      rest('news_scanner_feeds', 'select=*&order=priority.asc'),
      rest('news_scanner_log', 'select=*&order=ts.desc&limit=24'),
      rest('news_areas', 'select=*&order=opening.desc,id.asc')
    ]).then(function (r) {
      var feed = shape(r[0], r[1], r[2]);
      feed.areas = r[3] || [];
      var opening = (r[3] || []).filter(function (a) { return a.opening; })[0];
      if (opening) feed.openingArea = opening.name;
      return feed;
    });
  }

  /* ---------------- realtime ---------------- */
  function startRealtime(onChange) {
    if (!enabled) return false;
    import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm')
      .then(function (mod) {
        client = mod.createClient(SB.url, SB.anonKey, {
          realtime: { params: { eventsPerSecond: 4 } }
        });
        channel = client
          .channel('desk')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'news_reports' }, onChange)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'news_scanner_log' }, onChange)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'news_scanner_feeds' }, onChange)
          .subscribe(function (status) {
            if (status === 'SUBSCRIBED') {
              window.dispatchEvent(new CustomEvent('claudia:realtime', { detail: 'on' }));
            }
          });
      })
      .catch(function () {
        /* CDN blocked → callers fall back to polling */
        window.dispatchEvent(new CustomEvent('claudia:realtime', { detail: 'off' }));
      });
    return true;
  }

  /* ---------------- optional: editor write path ---------------- */
  function fileReport(report, editorKey) {
    if (!enabled) return Promise.reject(new Error('supabase not configured'));
    if (!editorKey) return Promise.reject(new Error('editor key required to file'));
    var url = SB.url.replace(/\/$/, '') + '/rest/v1/news_reports';
    return fetch(url, {
      method: 'POST',
      headers: headers({ Prefer: 'return=representation', 'x-editor-key': editorKey }),
      body: JSON.stringify(report)
    }).then(function (r) {
      if (!r.ok) throw new Error('file failed: HTTP ' + r.status);
      return r.json();
    });
  }

  /* ---------------- public API ---------------- */
  window.ClaudiaStore = {
    backend: enabled ? 'supabase' : 'file',
    ready: true,
    loadFeed: function () {
      if (!enabled) return Promise.reject(new Error('file backend'));
      return loadSupabase();
    },
    subscribe: startRealtime,
    fileReport: fileReport,
    areas: function () {
      if (!enabled) return Promise.resolve([]);
      return rest('news_areas', 'select=*&order=opening.desc,id.asc');
    }
  };
})();

</script>
<script>

   ============================================================ */
(function () {

  /* ---------------- embedded seed (used when feed.json is absent) --------- */
  var SEED = {

      },
      {

        dateline: 'CITY DESK',
