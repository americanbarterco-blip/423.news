<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>423.news · Advertising Network</title>
<style>
:root{color-scheme:dark;--bg:#07111c;--panel:#0f1d2c;--line:#294052;--text:#edf4fa;--muted:#9fb1c2;--accent:#ff5a0a;--green:#20b981;--red:#e05252}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif;padding:16px}main{max-width:1180px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}p,small{color:var(--muted)}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;background:var(--accent);color:white;padding:9px 13px;font-weight:700;cursor:pointer}button.secondary{background:#294052}button.danger{background:#9e3030}button:disabled{opacity:.5;cursor:not-allowed}
nav{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}nav button{white-space:nowrap;background:#1a3042}nav button.active{background:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;overflow:hidden}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{font-size:28px;font-weight:800}.muted{color:var(--muted)}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#050b12;color:var(--text)}textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.pill{display:inline-block;border-radius:20px;background:#20394d;padding:3px 8px;font-size:12px}.ok{color:#55d6a4}.warn{color:#ffc46b}.empty{padding:24px;text-align:center;color:var(--muted)}#notice{min-height:22px;color:#ffc46b}.hidden{display:none!important}.formtitle{margin:16px 0 4px}.help{font-size:12px;color:var(--muted);line-height:1.5}
</style></head><body><main>
<header><div><h1>Advertising Network</h1><small>423.news · Staff operations · Edition: 423</small></div><div class="actions"><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="logout">Log out</button></div></header>
<div id="notice" role="status"></div><div id="login" class="card hidden"><h2>Staff sign-in</h2><p>Use the existing 423.news administrator credentials. This page reuses the existing staff session.</p><label>Admin password</label><input id="password" type="password" autocomplete="current-password"><div class="actions"><button id="signin">Sign in</button></div></div>
<div id="app" class="hidden"><nav id="tabs"></nav><section id="view"></section></div>
</main>
<script>
(function(){
'use strict';
var SB='https://kdiwehqtezlhecxsoysj.supabase.co', ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkaXdlaHF0ZXpsaGVjeHNveXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NDQzOTEsImV4cCI6MjEwNjIyMDM5MX0.upw9MEq05Gs3czsmnknR1d37I2n3a681XzTJU-MGWwE';
var ADMIN=SB+'/functions/v1/admin', API=SB+'/functions/v1/ad-network', token=sessionStorage.getItem('t423')||'', data={}, tab='overview';
var $=function(id){return document.getElementById(id)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function say(m){$('notice').textContent=m||''}
function request(url,body){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json',apikey:ANON,Authorization:'Bearer '+ANON},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Request failed');return j})})}
function api(action,extra){return request(API,Object.assign({action:action,token:token},extra||{}))}
function authView(){ $('login').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden'); }
function appView(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden'); }
function login(){var pw=$('password').value;if(!pw)return;say('Signing in…');request(ADMIN,{action:'login',password:pw}).then(function(r){token=r.token;sessionStorage.setItem('t423',token);$('password').value='';load()}).catch(function(){say('Sign-in failed. Check the password or server connection.')})}
function load(){say('Loading advertising records…');api('dashboard').then(function(r){data=r.data||{};data.metrics=r.metrics||{};appView();render();say('Loaded '+(data.ad_campaigns||[]).length+' campaigns for edition '+r.edition_id+'.')}).catch(function(e){if(String(e.message).toLowerCase().includes('auth')){token='';sessionStorage.removeItem('t423');authView()}say('Could not load records: '+e.message+'. Apply supabase/ads-network-setup.sql and deploy the ad-network function first.')})}
var tabs=[['overview','Overview'],['advertisers','Advertisers'],['campaigns','Campaigns'],['orders','Orders'],['inventory','Inventory'],['packages','Packages']];
function render(){ $('tabs').innerHTML=tabs.map(function(t){return'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'active':'')+'">'+t[1]+'</button>'}).join('');$('view').innerHTML=tab==='overview'?overview():tab==='advertisers'?advertisers():tab==='campaigns'?campaigns():tab==='orders'?orders():tab==='inventory'?inventory():packages(); }
$('tabs').onclick=function(e){var b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};
function list(name){return data[name]||[]}
function fmtMoney(c){return c==null?'Custom quote':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(c)/100)}
function state(v){return'<span class="pill">'+esc(v||'—')+'</span>'}
function overview(){var m=data.metrics||{}, campaigns=list('ad_campaigns'), advertisers=list('ad_advertisers'), ads=list('news_ads');
return'<div class="grid"><div class="card"><small>Advertisers</small><div class="metric">'+(m.advertisers||advertisers.length)+'</div><small>Approved: '+(m.approvedAdvertisers||0)+'</small></div><div class="card"><small>Campaigns</small><div class="metric">'+(m.campaigns||campaigns.length)+'</div><small>Active: '+(m.activeCampaigns||0)+'</small></div><div class="card"><small>Impressions recorded</small><div class="metric">'+(m.impressions||0)+'</div></div><div class="card"><small>Clicks recorded</small><div class="metric">'+(m.clicks||0)+'</div></div></div><div class="card"><h2>Campaign pipeline</h2><div class="tablewrap"><table><thead><tr><th>Campaign</th><th>Advertiser</th><th>Status</th><th>Flight</th><th>Sold price</th></tr></thead><tbody>'+campaigns.slice(0,12).map(function(c){var a=advertisers.find(function(x){return x.id===c.advertiser_id})||{};return'<tr><td>'+esc(c.name)+'</td><td>'+esc(a.business_name)+'</td><td>'+state(c.status)+'</td><td>'+esc((c.starts_at||'—').slice(0,10))+' → '+esc((c.ends_at||'—').slice(0,10))+'</td><td>'+fmtMoney(c.sold_price_cents)+'</td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><h2>Existing 423.news ad inventory</h2><p class="help">The current Ads tab remains the control for image/video creative uploads and slot scheduling. Link a serving ad to a campaign from the Inventory tab below.</p><strong>'+ads.length+'</strong> ad records · '+ads.filter(function(a){return a.active}).length+' marked active</div><div class="card"><h2>Measurement status</h2><p class="help">Impression and click totals are shown only when validated delivery events have been recorded. Do not treat zero as proof that ads were not viewed; the delivery-event collector and instrumentation must be deployed before these figures become operational.</p></div>'}
function advertisers(){return'<div class="card"><h2>Advertisers</h2><p class="help">Keep business contacts and approval status inside this staff-only console. Approve an advertiser before activating a campaign.</p><div class="tablewrap"><table><thead><tr><th>Business</th><th>Contact</th><th>Service area</th><th>Status</th><th></th></tr></thead><tbody>'+list('ad_advertisers').map(function(a){return'<tr><td>'+esc(a.business_name)+'</td><td>'+esc(a.contact_name)+'<br><small>'+esc(a.contact_email)+'</small></td><td>'+esc(a.service_area)+'</td><td>'+state(a.status)+'</td><td><button class="secondary" data-edit-advertiser="'+a.id+'">Edit</button></td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><h2 id="advertiserHeading">Add advertiser</h2><form id="advertiserForm"><input type="hidden" name="id"><div class="row"><div><label>Business name *</label><input name="business_name" required maxlength="180"></div><div><label>Contact name</label><input name="contact_name"></div><div><label>Email</label><input name="contact_email" type="email"></div><div><label>Phone</label><input name="contact_phone"></div><div><label>Website</label><input name="website" type="url" placeholder="https://"></div><div><label>Business category</label><input name="category"></div><div><label>Service area</label><input name="service_area" placeholder="County, city, island or region"></div><div><label>Approval status</label><select name="status"><option>pending</option><option>approved</option><option>rejected</option><option>paused</option></select></div></div><label>Internal notes</label><textarea name="internal_notes"></textarea><div class="actions"><button>Save advertiser</button><button type="reset" class="secondary">Clear</button></div></form></div>'}
function campaigns(){return'<div class="card"><h2>Campaigns</h2><div class="tablewrap"><table><thead><tr><th>Campaign</th><th>Advertiser</th><th>Status</th><th>Dates</th><th>Sold price</th><th></th></tr></thead><tbody>'+list('ad_campaigns').map(function(c){var a=list('ad_advertisers').find(function(x){return x.id===c.advertiser_id})||{};return'<tr><td>'+esc(c.name)+'</td><td>'+esc(a.business_name)+'</td><td>'+state(c.status)+'</td><td>'+esc((c.starts_at||'').slice(0,10))+' – '+esc((c.ends_at||'').slice(0,10))+'</td><td>'+fmtMoney(c.sold_price_cents)+'</td><td><button class="secondary" data-edit-campaign="'+c.id+'">Edit</button></td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><h2 id="campaignHeading">Create campaign</h2><form id="campaignForm"><input type="hidden" name="id"><div class="row"><div><label>Campaign name *</label><input name="name" required></div><div><label>Advertiser *</label><select name="advertiser_id" required><option value="">Choose advertiser</option>'+list('ad_advertisers').map(function(a){return'<option value="'+a.id+'">'+esc(a.business_name)+' ('+esc(a.status)+')</option>'}).join('')+'</select></div><div><label>Package</label><select name="package_id"><option value="">Custom</option>'+list('ad_packages').filter(function(p){return p.active}).map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select></div><div><label>Status</label><select name="status"><option>draft</option><option>pending_review</option><option>approved</option><option>active</option><option>paused</option><option>completed</option><option>rejected</option></select></div><div><label>Start date</label><input name="starts_at" type="datetime-local"></div><div><label>End date</label><input name="ends_at" type="datetime-local"></div><div><label>Budget (cents)</label><input name="budget_cents" type="number" min="0"></div><div><label>Sold price (cents)</label><input name="sold_price_cents" type="number" min="0"></div></div><label>Objective / deliverables</label><textarea name="objective"></textarea><label>Internal notes</label><textarea name="internal_notes"></textarea><div class="actions"><button>Save campaign</button><button type="reset" class="secondary">Clear</button></div></form></div>'}
function orders(){return'<div class="card"><h2>Orders and sales tracking</h2><p class="help">This records the commercial status of a sale. It does not process payments, create invoices, or verify payment automatically.</p><div class="tablewrap"><table><thead><tr><th>Campaign</th><th>Advertiser</th><th>Amount</th><th>Status</th><th>Reference</th></tr></thead><tbody>'+list('ad_orders').map(function(o){var c=list('ad_campaigns').find(function(x){return x.id===o.campaign_id})||{};var a=list('ad_advertisers').find(function(x){return x.id===o.advertiser_id})||{};return'<tr><td>'+esc(c.name)+'</td><td>'+esc(a.business_name)+'</td><td>'+fmtMoney(o.amount_cents)+'</td><td>'+state(o.status)+'</td><td>'+esc(o.reference_note)+'</td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><h2>Create order record</h2><form id="orderForm"><div class="row"><div><label>Campaign *</label><select name="campaign_id" required><option value="">Choose campaign</option>'+list('ad_campaigns').map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div><label>Advertiser *</label><select name="advertiser_id" required><option value="">Choose advertiser</option>'+list('ad_advertisers').map(function(a){return'<option value="'+a.id+'">'+esc(a.business_name)+'</option>'}).join('')+'</select></div><div><label>Amount (cents) *</label><input name="amount_cents" type="number" min="0" required></div><div><label>Status</label><select name="status"><option>quoted</option><option>contracted</option><option>invoiced</option><option>paid</option><option>fulfilled</option><option>cancelled</option></select></div></div><label>Reference / notes</label><textarea name="reference_note"></textarea><div class="actions"><button>Save order</button></div></form></div>'}
function inventory(){return'<div class="card"><h2>Link existing display ads to campaigns</h2><p class="help">Upload and schedule the image/video in the existing Admin → Ads tab first. Then associate the ad with an approved campaign here. This does not publish an ad by itself or change its active/pause setting.</p><div class="tablewrap"><table><thead><tr><th>Creative</th><th>Placement</th><th>Current state</th><th>Campaign link</th><th></th></tr></thead><tbody>'+list('news_ads').map(function(a){return'<tr><td>'+esc(a.title||a.id)+'</td><td>'+esc(a.slot)+' · '+esc(a.kind)+'</td><td>'+state(a.active?'active':'paused')+'</td><td><select data-link-select="'+a.id+'"><option value="">Unlinked</option>'+list('ad_campaigns').map(function(c){return'<option value="'+c.id+'" '+(c.id===a.campaign_id?'selected':'')+'>'+esc(c.name)+' ('+esc(c.status)+')</option>'}).join('')+'</select></td><td><button data-link-ad="'+a.id+'">Save link</button></td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><h2>Placement registry</h2>'+list('ad_placements').map(function(p){return'<p><b>'+esc(p.name)+'</b> · '+esc(p.placement_key)+' · '+state(p.active?'active':'inactive')+'<br><small>'+esc(p.description)+'</small></p>'}).join('')+'</div>'}
function packages(){return'<div class="card"><h2>Packages</h2><div class="tablewrap"><table><thead><tr><th>Package</th><th>Placement</th><th>Duration</th><th>Price</th><th>Active</th></tr></thead><tbody>'+list('ad_packages').map(function(p){return'<tr><td>'+esc(p.name)+'<br><small>'+esc(p.description)+'</small></td><td>'+esc(p.placement_key)+'</td><td>'+p.duration_days+' days</td><td>'+fmtMoney(p.price_cents)+'</td><td>'+state(p.active?'yes':'no')+'</td></tr>'}).join('')+'</tbody></table></div></div><div class="card"><h2>Add package</h2><form id="packageForm"><div class="row"><div><label>Name *</label><input name="name" required></div><div><label>Placement key</label><input name="placement_key" value="custom"></div><div><label>Duration (days)</label><input name="duration_days" type="number" min="1" max="365" value="30"></div><div><label>Price (cents, blank = quote)</label><input name="price_cents" type="number" min="0"></div></div><label>Description</label><textarea name="description"></textarea><div class="actions"><button>Save package</button></div></form></div>'}
function values(form){var o={};new FormData(form).forEach(function(v,k){o[k]=String(v).trim()});return o}
function dateFields(o){['starts_at','ends_at'].forEach(function(k){if(o[k])o[k]=new Date(o[k]).toISOString();else o[k]=null});['budget_cents','sold_price_cents'].forEach(function(k){if(o[k]==='')o[k]=null;else if(o[k]!=null)o[k]=Number(o[k])});if(o.duration_days)o.duration_days=Number(o.duration_days);if(o.price_cents==='')o.price_cents=null;else if(o.price_cents!=null)o.price_cents=Number(o.price_cents);if(o.amount_cents!=null)o.amount_cents=Number(o.amount_cents);return o}
$('view').onsubmit=function(e){e.preventDefault();var f=e.target,o=values(f),act=f.id==='advertiserForm'?'saveAdvertiser':f.id==='campaignForm'?'saveCampaign':f.id==='orderForm'?'saveOrder':f.id==='packageForm'?'savePackage':null;if(!act)return;dateFields(o);say('Saving…');api(act,{record:o}).then(function(){say('Saved.');load()}).catch(function(x){say('Save failed: '+x.message)})};
$('view').onclick=function(e){var id=e.target.getAttribute('data-edit-advertiser');if(id){var a=list('ad_advertisers').find(function(x){return x.id===id});var f=$('advertiserForm');Object.keys(a).forEach(function(k){if(f.elements[k])f.elements[k].value=a[k]??''});$('advertiserHeading').textContent='Edit advertiser';window.scrollTo(0,document.body.scrollHeight);return}
id=e.target.getAttribute('data-edit-campaign');if(id){var c=list('ad_campaigns').find(function(x){return x.id===id});var f=$('campaignForm');Object.keys(c).forEach(function(k){if(f.elements[k]){var v=c[k]??'';if((k==='starts_at'||k==='ends_at')&&v)v=new Date(v).toISOString().slice(0,16);f.elements[k].value=v}});$('campaignHeading').textContent='Edit campaign';window.scrollTo(0,document.body.scrollHeight);return}
id=e.target.getAttribute('data-link-ad');if(id){var sel=document.querySelector('[data-link-select="'+id+'"]');if(!sel||!sel.value){say('Choose a campaign first.');return}api('linkAd',{ad_id:id,campaign_id:sel.value}).then(function(){say('Ad linked to campaign.');load()}).catch(function(x){say('Link failed: '+x.message)})}};
$('signin').onclick=login;$('password').onkeydown=function(e){if(e.key==='Enter')login()};$('refresh').onclick=load;$('logout').onclick=function(){token='';sessionStorage.removeItem('t423');authView();say('Signed out.')};
if(token)load();else authView();
})();
</script></body></html>
