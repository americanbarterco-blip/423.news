name: Claudia public-source discovery and intake
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - scripts/claudia_*.py
      - scripts/claudia_sources.json
      - .github/workflows/claudia-story-discovery.yml
  pull_request:
    paths:
      - scripts/claudia_discovery.py
      - scripts/claudia_sources.json
      - scripts/claudia_workloop.py
      - scripts/claudia_research_executor.py
      - scripts/claudia_draft_writer.py
      - scripts/claudia_community_discovery.py
      - scripts/claudia_site_coverage_audit.py
      - scripts/test_claudia_*.py
      - supabase/migrations/20261121000000_claudia_story_discovery.sql
      - supabase/migrations/20261121000001_claudia_media_staging.sql
      - supabase/migrations/20261121000003_claudia_task_claim.sql
      - .github/workflows/claudia-story-discovery.yml
permissions:
  contents: read
concurrency:
  group: claudia-public-discovery
  cancel-in-progress: false
jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile newsroom scripts
        run: python -m py_compile scripts/claudia_discovery.py scripts/claudia_workloop.py scripts/claudia_research_executor.py scripts/claudia_draft_writer.py scripts/claudia_community_discovery.py scripts/claudia_site_coverage_audit.py scripts/test_claudia_discovery.py scripts/test_claudia_workloop.py scripts/test_claudia_research_executor.py scripts/test_claudia_draft_writer.py scripts/test_claudia_community_discovery.py scripts/test_claudia_site_coverage_audit.py scripts/claudia_media.py scripts/claudia_media_review.py scripts/claudia_audio_transcribe.py
      - name: Run unit tests
        run: python -m unittest scripts.test_claudia_discovery scripts.test_claudia_workloop scripts.test_claudia_research_executor scripts.test_claudia_draft_writer scripts.test_claudia_community_discovery scripts.test_claudia_site_coverage_audit scripts.test_claudia_media
      - name: Run static coverage audit
        run: python scripts/claudia_site_coverage_audit.py --root . --json-out claudia-site-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: claudia-site-coverage
          path: claudia-site-coverage.json
          retention-days: 14
  scheduled-discovery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_CONFIGURED: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      CLAUDIA_WRITER_MODEL: ${{ secrets.CLAUDIA_WRITER_MODEL }}
      OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDIA_TRANSCRIBE_MODEL: ${{ secrets.CLAUDIA_TRANSCRIBE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gemini transcription SDK (optional audio workflow)\n        run: python -m pip install --upgrade google-genai\n      - name: Transcribe authorized media inbox files (optional)\n        run: |\n          mkdir -p scripts/media-inbox claudia-transcripts\n          python scripts/claudia_audio_transcribe.py --inbox scripts/media-inbox --out claudia-transcripts\n      - name: Upload private transcript artifacts\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: claudia-audio-transcripts\n          path: claudia-transcripts/\n          if-no-files-found: ignore\n          retention-days: 14\n      - name: Discover public RSS and web leads
        env:
          CLAUDIA_DISCOVERY_INGEST: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' && 'true' || 'false' }}
        run: python scripts/claudia_discovery.py
      - name: Queue discoveries
        if: env.SUPABASE_CONFIGURED == 'true'
        run: python scripts/claudia_workloop.py
      - name: Execute bounded research batch
        if: env.SUPABASE_CONFIGURED == 'true'
        env:
          CLAUDIA_RESEARCH_BATCH: '3'
        run: python scripts/claudia_research_executor.py
      - name: Community/video discovery (optional APIs)
        run: python scripts/claudia_community_discovery.py
      - name: Generate private review-only article drafts
        if: env.SUPABASE_CONFIGURED == 'true' && env.OPENAI_CONFIGURED == 'true'
        run: python scripts/claudia_draft_writer.py
      - name: Save discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudia-discovery
          path: claudia-discovery.json
          retention-days: 14