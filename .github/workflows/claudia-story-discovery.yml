name: Claudia public-source discovery and intake
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/claudia_*.py
      - scripts/claudia_sources.json
      - .github/workflows/claudia-story-discovery.yml
      - livekit-agent/agent.py
      - livekit-agent/claudia_public_search.py
      - scripts/test_claudia_public_search.py
      - scripts/test_claudia_draft_writer.py
  pull_request:
    paths:
      - scripts/claudia_*.py
      - scripts/claudia_sources.json
      - supabase/migrations/20261121000000_claudia_story_discovery.sql
      - supabase/migrations/20261121000001_claudia_media_staging.sql
      - supabase/migrations/20261121000003_claudia_task_claim.sql
      - .github/workflows/claudia-story-discovery.yml
      - livekit-agent/agent.py
      - livekit-agent/claudia_public_search.py
      - scripts/test_claudia_public_search.py
permissions:
  contents: read
concurrency:
  group: claudia-public-discovery
  cancel-in-progress: false
jobs:
  tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile newsroom scripts
        run: python -m py_compile scripts/claudia_discovery.py scripts/claudia_workloop.py scripts/claudia_research_executor.py scripts/claudia_draft_writer.py scripts/claudia_community_discovery.py scripts/claudia_site_coverage_audit.py scripts/claudia_audio_transcribe.py scripts/claudia_discovered_media_transcribe.py scripts/claudia_gemini_analyzer.py scripts/claudia_media.py scripts/claudia_media_review.py livekit-agent/agent.py livekit-agent/claudia_public_search.py
      - name: Run unit tests
        run: python -m unittest scripts.test_claudia_discovery scripts.test_claudia_workloop scripts.test_claudia_research_executor scripts.test_claudia_draft_writer scripts.test_claudia_community_discovery scripts.test_claudia_site_coverage_audit scripts.test_claudia_audio_transcribe scripts.test_claudia_gemini_analyzer scripts.test_claudia_public_search
      - name: Run static coverage audit
        run: python scripts/claudia_site_coverage_audit.py --root . --json-out claudia-site-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: claudia-site-coverage
          path: claudia-site-coverage.json
          retention-days: 14
  scheduled-discovery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://kdiwehqtezlhecxsoysj.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_CONFIGURED: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      CLAUDIA_WRITER_MODEL: ${{ secrets.CLAUDIA_WRITER_MODEL }}
      OPENAI_API_URL: ${{ secrets.OPENAI_API_URL }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      CLAUDIA_TRANSCRIBE_MODEL: ${{ secrets.CLAUDIA_TRANSCRIBE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional transcription tools
        run: python -m pip install --upgrade google-genai yt-dlp
      - name: Transcribe manually staged media inbox (optional)
        run: |
          mkdir -p scripts/media-inbox claudia-transcripts
          python scripts/claudia_audio_transcribe.py --inbox scripts/media-inbox --out claudia-transcripts
      - name: Discover public RSS and web leads
        env:
          CLAUDIA_DISCOVERY_INGEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && 'true' || 'false' }}
        run: python scripts/claudia_discovery.py
      - name: Queue discoveries
        if: env.SUPABASE_CONFIGURED == 'true'
        run: python scripts/claudia_workloop.py
      - name: Execute bounded research batch
        if: env.SUPABASE_CONFIGURED == 'true'
        env:
          CLAUDIA_RESEARCH_BATCH: '5'
        run: python scripts/claudia_research_executor.py
      - name: Discover community and YouTube leads
        run: python scripts/claudia_community_discovery.py
      - name: Transcribe discovered video and direct media leads
        continue-on-error: true
        run: python scripts/claudia_discovered_media_transcribe.py --discovery claudia-discovery.json --community claudia-community-discovery.json --out claudia-transcripts --limit 3
      - name: Generate, fact-check, save private drafts, and flag exceptions
        if: env.SUPABASE_CONFIGURED == 'true' && env.OPENAI_CONFIGURED == 'true'
        run: python scripts/claudia_draft_writer.py
      - name: Upload private transcript artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claudia-transcripts
          path: claudia-transcripts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claudia-discovery
          path: |
            claudia-discovery.json
            claudia-community-discovery.json
          if-no-files-found: ignore
          retention-days: 14
