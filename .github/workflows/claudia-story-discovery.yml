name: Claudia public-source discovery and intake
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/claudia_*.py
      - scripts/claudia_sources.json
      - .github/workflows/claudia-story-discovery.yml
      - livekit-agent/agent.py
      - livekit-agent/claudia_public_search.py
      - scripts/test_claudia_public_search.py
      - scripts/test_claudia_draft_writer.py
  pull_request:
    paths:
      - scripts/claudia_*.py
      - scripts/claudia_sources.json
      - supabase/migrations/20261121000000_claudia_story_discovery.sql
      - supabase/migrations/20261121000001_claudia_media_staging.sql
      - supabase/migrations/20261121000003_claudia_task_claim.sql
      - .github/workflows/claudia-story-discovery.yml
      - livekit-agent/agent.py
      - livekit-agent/claudia_public_search.py
      - scripts/test_claudia_public_search.py
permissions:
  contents: read
concurrency:
  group: claudia-public-discovery
  cancel-in-progress: false
jobs:
  tests:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile newsroom scripts
        run: python -m py_compile scripts/claudia_discovery.py scripts/claudia_workloop.py scripts/claudia_research_executor.py scripts/claudia_draft_writer.py scripts/claudia_community_discovery.py scripts/claudia_site_coverage_audit.py scripts/claudia_audio_transcribe.py scripts/claudia_discovered_media_transcribe.py scripts/claudia_gemini_analyzer.py scripts/claudia_media.py scripts/claudia_media_review.py livekit-agent/agent.py livekit-agent/claudia_public_search.py
      - name: Run unit tests
        run: python -m unittest scripts.test_claudia_discovery scripts.test_claudia_workloop scripts.test_claudia_research_executor scripts.test_claudia_draft_writer scripts.test_claudia_community_discovery scripts.test_claudia_site_coverage_audit scripts.test_claudia_audio_transcribe scripts.test_claudia_gemini_analyzer scripts.test_claudia_public_search
      - name: Run static coverage audit
        run: python scripts/claudia_site_coverage_audit.py --root . --json-out claudia-site-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: claudia-site-coverage
          path: claudia-site-coverage.json
          retention-days: 14
  scheduled-discovery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://kdiwehqtezlhecxsoysj.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SUPABASE_CONFIGURED: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLAUDIA_WRITER_MODEL: ${{ secrets.CLAUDIA_WRITER_MODEL }}
      CLAUDIA_AI_BASE_URL: ${{ secrets.CLAUDIA_AI_BASE_URL }}
      CLAUDIA_AI_CONFIGURED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      CLAUDIA_TRANSCRIBE_MODEL: ${{ secrets.CLAUDIA_TRANSCRIBE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional transcription tools
        run: python -m pip install --upgrade google-genai yt-dlp
      - name: Transcribe manually staged media inbox (optional)
        run: |
          mkdir -p scripts/media-inbox claudia-transcripts
          python scripts/claudia_audio_transcribe.py --inbox scripts/media-inbox --out claudia-transcripts
      - name: Discover public RSS and web leads
        env:
          CLAUDIA_DISCOVERY_INGEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && 'true' || 'false' }}
        run: python scripts/claudia_discovery.py
      - name: Queue discoveries
        if: env.SUPABASE_CONFIGURED == 'true'
        run: python scripts/claudia_workloop.py
      - name: Execute bounded research batch
        if: env.SUPABASE_CONFIGURED == 'true'
        env:
          CLAUDIA_RESEARCH_BATCH: '5'
        run: python scripts/claudia_research_executor.py
      - name: Discover community and YouTube leads
        run: python scripts/claudia_community_discovery.py
      - name: Transcribe discovered video and direct media leads
        continue-on-error: true
        run: python scripts/claudia_discovered_media_transcribe.py --discovery claudia-discovery.json --community claudia-community-discovery.json --out claudia-transcripts --limit 3
      - name: API credential smoke test (non-scheduled runs only)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          results=[]
          def check(name, req):
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body=json.loads(r.read().decode('utf-8'))
                      count=len(body.get('organic',[])) if name=='Serper' else len(body.get('results',[])) if name=='Tavily' else len(body.get('data',[])) if name=='OpenAI models' else 1
                      results.append(f"{name}: PASS (HTTP {r.status}; {count} result(s))")
              except urllib.error.HTTPError as e:
                  results.append(f"{name}: FAIL (HTTP {e.code})")
              except Exception as e:
                  results.append(f"{name}: FAIL ({type(e).__name__})")
          q="Chattanooga Tennessee local news"
          k=os.getenv("SERPER_API_KEY","").strip()
          if k:
              check("Serper",urllib.request.Request("https://google.serper.dev/search",data=json.dumps({"q":q,"num":3}).encode(),headers={"X-API-KEY":k,"Content-Type":"application/json"},method="POST"))
          else: results.append("Serper: SKIP (secret missing)")
          k=os.getenv("TAVILY_API_KEY","").strip()
          if k:
              check("Tavily",urllib.request.Request("https://api.tavily.com/search",data=json.dumps({"query":q,"max_results":3,"search_depth":"basic"}).encode(),headers={"Authorization":"Bearer "+k,"Content-Type":"application/json"},method="POST"))
          else: results.append("Tavily: SKIP (secret missing)")
          k=os.getenv("CLOUDFLARE_API_TOKEN","").strip()
          account=os.getenv("CLOUDFLARE_ACCOUNT_ID","").strip()
          model=os.getenv("CLAUDIA_WRITER_MODEL","@cf/meta/llama-3.1-8b-instruct").strip()
          if k and account:
              payload={"model":model,"max_tokens":8,"temperature":0,"messages":[{"role":"user","content":"Reply only OK."}]}
              endpoint="https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/v1/chat/completions"
              check("Cloudflare Workers AI",urllib.request.Request(endpoint,data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+k,"Content-Type":"application/json"},method="POST"))
          else: results.append("Cloudflare Workers AI: SKIP (account ID or API token secret missing)")
          summary="\n".join(results)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Claudia API smoke test\n\n"+summary+"\n")
          with open("claudia-api-smoke.txt","w",encoding="utf-8") as f:
              f.write(summary+"\n")
          PY
      - name: Upload API smoke test results
        if: github.event_name != 'schedule' && always()
        uses: actions/upload-artifact@v4
        with:
          name: claudia-api-smoke
          path: claudia-api-smoke.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate, verify, automatically publish, and flag factual exceptions
        if: env.SUPABASE_CONFIGURED == 'true'
        run: python scripts/claudia_draft_writer.py
      - name: Upload private transcript artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claudia-transcripts
          path: claudia-transcripts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claudia-discovery
          path: |
            claudia-discovery.json
            claudia-community-discovery.json
          if-no-files-found: ignore
          retention-days: 14
