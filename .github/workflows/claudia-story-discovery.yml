name: Claudia public-source discovery and intake
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/claudia_discovery.py
      - scripts/claudia_sources.json
      - scripts/test_claudia_discovery.py
      - scripts/claudia_workloop.py
      - scripts/test_claudia_workloop.py
      - scripts/claudia_media.py
      - scripts/test_claudia_media.py
      - supabase/migrations/20261121000000_claudia_story_discovery.sql
      - supabase/migrations/20261121000001_claudia_media_staging.sql
      - .github/workflows/claudia-story-discovery.yml
permissions:
  contents: read
concurrency:
  group: claudia-public-discovery
  cancel-in-progress: false
jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/claudia_discovery.py scripts/claudia_workloop.py scripts/test_claudia_discovery.py scripts/test_claudia_workloop.py scripts/claudia_media.py scripts/test_claudia_media.py
      - run: python -m unittest scripts.test_claudia_discovery scripts.test_claudia_workloop scripts.test_claudia_media
  scheduled-discovery:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public source discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAUDIA_DISCOVERY_INGEST: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' && 'true' || 'false' }}
        run: python scripts/claudia_discovery.py
      - name: Queue research leads
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/claudia_workloop.py
      - name: Save discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudia-public-discovery
          path: claudia-discovery.json
          retention-days: 14
