name: Validate IndexNow deployment wiring

on:
  pull_request:
    paths:
      - 'ef61166f0435493c9aae43c3d90a25cf.txt'
      - '.github/workflows/deploy-423-news-cloudflare.yml'
      - '.github/workflows/indexnow-validation.yml'
      - 'scripts/test_indexnow_config.py'
  push:
    branches: [main]
    paths:
      - 'ef61166f0435493c9aae43c3d90a25cf.txt'
      - '.github/workflows/deploy-423-news-cloudflare.yml'
      - '.github/workflows/indexnow-validation.yml'
      - 'scripts/test_indexnow_config.py'

permissions:
  contents: read


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate IndexNow key, sitemap, and deployment trigger
        run: python -m unittest scripts/test_indexnow_config.py -v
