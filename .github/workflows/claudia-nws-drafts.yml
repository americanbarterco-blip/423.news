name: Claudia — NWS alert drafts
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and save 423-area alerts as drafts
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 nws_alerts.py
      - name: Explain missing credentials
        if: ${{ secrets.SUPABASE_URL == '' || secrets.SUPABASE_SERVICE_KEY == '' }}
        run: echo "Skipped safely. Add SUPABASE_URL and SUPABASE_SERVICE_KEY as GitHub Actions secrets to enable draft creation."
