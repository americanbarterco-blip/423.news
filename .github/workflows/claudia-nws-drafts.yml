name: Claudia — NWS alert drafts
on:
  pull_request:
    paths:
      - "nws_alerts.py"
      - ".github/workflows/claudia-nws-drafts.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python3 -m py_compile nws_alerts.py
      - name: Fetch and save 423-area alerts as drafts
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 nws_alerts.py
