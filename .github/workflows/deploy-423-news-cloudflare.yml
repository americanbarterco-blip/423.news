name: Deploy 423.news Worker to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - '.assetsignore'
      - 'wrangler.jsonc'
      - 'sitemap.xml'
      - 'robots.txt'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - '**/*.txt'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.ico'
      - '**/*.mp4'

permissions:
  contents: read
  issues: write

concurrency:
  group: 423-news-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Validate Cloudflare credentials
        id: credentials
        continue-on-error: true
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare secrets are missing. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets."
            exit 1
          fi
      - name: Stage exact original Arcade games
        if: steps.credentials.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arcade/games
          download_game() {
            local filename="$1"
            local expected_sha="$2"
            local destination="arcade/games/$filename"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 20 --max-time 600 \
              "https://bigdfleamarket.online/$filename" -o "$destination"
            printf '%s  %s\n' "$expected_sha" "$destination" | sha256sum --check
            test -s "$destination"
          }
          download_game "game-mr-green.html" "3b68e1e0b9153b1cae40976e84f807ee068c0227d7119527439903a096e5be29"
          download_game "game-trumps-quarters.html" "7f22e4a47e8dea95bb42114cdf44f0af008d68ce93934e8fb34e121c86bd4e47"
          download_game "game-quarter-shoveler.html" "0eec745c118f700d3641d90cc264b7d05dd40551c96b7818beda1b9e95b8e0c7"
          download_game "game-atv-deer-dodge.html" "b7d67b0564e3b32410cf232312149cc227b5d6bfb6b479286c295bad330d6373"
          download_game "game-apex-society-hunt.html" "681f0806428e516f961fe5f36817557fc62d7aa731e510163b515b8d383537e2"
          python3 scripts/prepare-arcade-games.py
      - name: Deploy with Wrangler
        id: deploy
        if: steps.credentials.outcome == 'success'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.jsonc
      - name: Record Cloudflare deployment blocker
        if: steps.credentials.outcome != 'success' || steps.deploy.outcome != 'success'
        uses: actions/github-script@v7
        env:
          CREDENTIAL_OUTCOME: ${{ steps.credentials.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        with:
          script: |
            const title = 'Claudia Cloudflare deployment blocked — 423.news';
            const missing = `Set repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts Edit) and CLOUDFLARE_ACCOUNT_ID to enable automated Worker deployments. This run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const failed = `Cloudflare deployment failed. Review the workflow logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = process.env.CREDENTIAL_OUTCOME !== 'success' ? missing : failed;
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            const existing = open.data.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
      - name: Fail if deployment is blocked
        if: steps.credentials.outcome != 'success' || steps.deploy.outcome != 'success'
        run: exit 1
