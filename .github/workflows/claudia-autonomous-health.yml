name: Claudia Green — autonomous site health

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/claudia_health.py'
      - 'scripts/test_claudia_health.py'
      - 'scripts/claudia_task_memory.py'
      - 'scripts/test_claudia_task_memory.py'
      - 'livekit-agent/agent.py'
      - '_worker.js'
      - 'wrangler.jsonc'
      - 'sitemap.xml'
      - 'robots.txt'
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.ico'
      - '**/*.mp4'
      - '.github/workflows/deploy-423-news-cloudflare.yml'
      - '.github/workflows/claudia-autonomous-health.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: claudia-site-health
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check monitor, tests, and LiveKit agent
        run: python -m py_compile scripts/claudia_health.py scripts/test_claudia_health.py scripts/claudia_task_memory.py scripts/test_claudia_task_memory.py livekit-agent/agent.py
      - name: Run offline health-monitor tests
        run: python -m unittest scripts/test_claudia_health.py scripts/test_claudia_task_memory.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check Cloudflare Worker
        run: node --input-type=module --check < _worker.js
      - name: Validate Wrangler config JSON
        run: node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); console.log('Wrangler config is valid JSON')"
      - name: Validate Cloudflare deployment workflow YAML
        run: ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy-423-news-cloudflare.yml'); puts 'Workflow YAML parsed'"

  audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check live site
        id: health
        continue-on-error: true
        run: python scripts/claudia_health.py
      - name: Update Claudia resumable task memory\n        if: always()\n        run: python scripts/claudia_task_memory.py\n      - name: Commit operational task memory\n        if: always()\n        run: |\n          git config user.name '423news-bot'\n          git config user.email 'bot@users.noreply.github.com'\n          git add claudia-work-memory.json\n          git diff --cached --quiet || (git commit -m 'Update Claudia resumable task memory' && git push)\n      - name: Save health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claudia-site-health
          path: claudia-health.*
          if-no-files-found: warn
          retention-days: 30
      - name: Update Claudia findings issue
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('claudia-health.json', 'utf8'));
            const body = fs.readFileSync('claudia-health.md', 'utf8');
            const title = 'Claudia autonomous health findings — 423.news';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100
            });
            const issue = existing.data.find(i => i.title === title);
            if (issue) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body});
              core.info('Updated existing Claudia health issue #' + issue.number);
            } else {
              const created = await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
                title, body});
              core.info('Created Claudia health issue #' + created.data.number);
            }
      - name: Fail run when site has high/medium findings
        if: steps.health.outcome == 'failure'
        run: exit 1
