name: Update checkpoints
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils
      - run: python3 update_checkpoints.py
      - name: Commit changes
        run: |
          git config user.name "423news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add checkpoints.json geocode_cache.json
          git diff --cached --quiet || (git commit -m "Auto-update checkpoints" && git push)
