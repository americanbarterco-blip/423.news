name: Claudia Green - isolated direct-provider preview

on:
  push:
    branches:
      - preview/claudia-direct-provider-migration
    paths:
      - livekit-agent-preview/**
      - .github/workflows/claudia-direct-provider-preview.yml
  workflow_dispatch:
    inputs:
      operation:
        description: "Create the separate preview agent, or deploy an update to that preview agent"
        required: true
        type: choice
        options:
          - create
          - deploy
        default: create

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: claudia-direct-provider-preview
  cancel-in-progress: false

jobs:
  create-preview-agent:
    if: github.event.inputs.operation == 'create'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/claudia-direct-provider-migration
          token: ${{ github.token }}

      - name: Create and deploy the separate preview agent
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: GOOGLE_API_KEY=${{ secrets.GEMINI_API_KEY }}
        with:
          OPERATION: create
          REGION: us-east
          WORKING_DIRECTORY: livekit-agent-preview

      - name: Open a configuration-only pull request for the new preview agent
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          add-paths: livekit-agent-preview/livekit.toml
          branch: claudia-preview-livekit-config-${{ github.run_id }}
          delete-branch: false
          base: preview/claudia-direct-provider-migration
          title: "Add isolated Claudia preview agent configuration"
          commit-message: "Add isolated Claudia preview agent configuration"
          body: |
            Adds the LiveKit-generated configuration for the separate
            claudia-green-preview agent. This does not modify production.

      - name: Check out the generated configuration branch
        uses: actions/checkout@v4
        with:
          ref: claudia-preview-livekit-config-${{ github.run_id }}
          token: ${{ github.token }}

      - name: Confirm the preview agent is running
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: livekit-agent-preview
          TIMEOUT: 5m

  deploy-preview-update:
    if: github.event_name == 'push' || github.event.inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/claudia-direct-provider-migration

      - name: Verify Gemini fallback credential without exposing it
        id: gemini
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("GOOGLE_API_KEY", "").strip()
          available = False
          if not key:
              print("::warning::Gemini fallback key is missing; GPT remains primary.")
          else:
              req = urllib.request.Request(
                  "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash",
                  headers={"x-goog-api-key": key},
              )
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      available = 200 <= response.status < 300
                  print("Gemini fallback credential verified for gemini-3.8-flash.")
              except urllib.error.HTTPError as exc:
                  if exc.code in (400, 401, 403, 404):
                      available = False
                      print(f"::warning::Gemini fallback credential/model check failed (HTTP {exc.code}); GPT remains primary.")
                  else:
                      available = True
                      print(f"::warning::Gemini preflight was transiently unavailable (HTTP {exc.code}); fallback remains configured.")
              except Exception as exc:
                  available = True
                  print(f"::warning::Gemini preflight could not complete ({type(exc).__name__}); fallback remains configured.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("available=" + ("true" if available else "false") + "\n")
          PY

      - name: Deploy an update to the separate preview agent only
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: GOOGLE_API_KEY=${{ secrets.GEMINI_API_KEY }},CLAUDIA_GEMINI_FALLBACK_ENABLED=${{ steps.gemini.outputs.available }},CLAUDIA_MEMORY_SUPABASE_URL=${{ secrets.CLAUDIA_MEMORY_SUPABASE_URL }},CLAUDIA_MEMORY_SERVICE_KEY=${{ secrets.CLAUDIA_MEMORY_SERVICE_KEY }},X_API_BEARER_TOKEN=${{ secrets.X_API_BEARER_TOKEN }},YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }},CLAUDIA_GITHUB_TOKEN=${{ secrets.CLAUDIA_GITHUB_TOKEN }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: livekit-agent-preview
