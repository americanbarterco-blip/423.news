name: Claudia Green - manual LiveKit deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Create Claudia in the migration LiveKit project, or deploy an approved update"
        required: true
        type: choice
        options:
          - create
          - deploy
        default: create

permissions:
  contents: write
  actions: read

concurrency:
  group: claudia-livekit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reject-wrong-create-branch:
    if: github.event.inputs.operation == 'create' && github.ref != 'refs/heads/fix/claudia-livekit-agent-create-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Stop unsafe create attempt
        run: |
          echo "::error::For the new 423.news LiveKit project, run CREATE only from the fix/claudia-livekit-agent-create-workflow branch."
          exit 1

  create-agent:
    if: github.event.inputs.operation == 'create' && github.ref == 'refs/heads/fix/claudia-livekit-agent-create-workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Remove the incomplete config so LiveKit can generate a fresh agent ID
        run: |
          rm -f livekit-agent/livekit.toml
          test ! -e livekit-agent/livekit.toml

      - name: Create Claudia in the new LiveKit project
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: create
          WORKING_DIRECTORY: livekit-agent

      - name: Verify and save the generated agent ID on this migration branch
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -s livekit-agent/livekit.toml
          grep -Eq '^\\s*id\\s*=' livekit-agent/livekit.toml || {
            echo "::error::LiveKit did not write an agent ID to livekit-agent/livekit.toml."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livekit-agent/livekit.toml
          git diff --cached --quiet && {
            echo "::error::Generated LiveKit config has no changes to save."
            exit 1
          }
          git commit -m "Save new Claudia LiveKit agent ID"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Confirm Claudia reaches Running
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: livekit-agent
          TIMEOUT: 5m

  deploy-agent:
    if: github.event.inputs.operation == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out 423.news
        uses: actions/checkout@v4

      - name: Deploy Claudia Green update to LiveKit Cloud
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: livekit-agent
