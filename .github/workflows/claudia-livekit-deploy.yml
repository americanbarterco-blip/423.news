name: Claudia Green - manual LiveKit deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Create Claudia the first time, or deploy an update later"
        required: true
        type: choice
        options:
          - create
          - deploy
        default: create

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: claudia-livekit-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-agent:
    if: github.event.inputs.operation == 'create'
    runs-on: ubuntu-latest
    steps:
      - name: Check out 423.news
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Create and deploy Claudia Green to LiveKit Cloud
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: \${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: \${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: \${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: \${{ secrets.SECRET_LIST }}
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: create
          WORKING_DIRECTORY: livekit-agent

      - name: Save LiveKit agent configuration in a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: \${{ secrets.GITHUB_TOKEN }}
          add-paths: livekit-agent/livekit.toml
          branch: claudia-livekit-agent-config
          delete-branch: false
          title: "Add Claudia Green LiveKit agent configuration"
          commit-message: "Add Claudia Green LiveKit agent configuration"
          body: |
            This pull request adds the LiveKit-generated configuration for Claudia Green.
            The agent deployment is performed only when the manual workflow is run.

      - name: Check that Claudia is running
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: \${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: \${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: \${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: livekit-agent
          TIMEOUT: 5m

  deploy-agent:
    if: github.event.inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out 423.news
        uses: actions/checkout@v4

      - name: Deploy Claudia Green update to LiveKit Cloud
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: \${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: \${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: \${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: \${{ secrets.SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: livekit-agent
