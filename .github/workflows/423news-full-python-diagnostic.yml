name: 423.news Full Python Diagnostic
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-python-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all repository Python files
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = sorted(Path(".").rglob("*.py"))
          files = [p for p in files if ".git" not in p.parts and ".venv" not in p.parts and "venv" not in p.parts]
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          print(f"Compiled {len(files)} Python files")
          if failures:
              print("\\n".join(failures))
              raise SystemExit(1)
          PY
      - name: Run repository Python test suite
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
