name: Deploy Claudia Green LiveKit Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'livekit-agent/agent.py'

concurrency:
  group: claudia-green-livekit-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy existing Claudia agent
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy existing LiveKit agent to production
        uses: livekit/deploy-action@v2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ format('{0},CLAUDIA_GITHUB_TOKEN={1}', secrets.SECRET_LIST, secrets.CLAUDIA_GITHUB_TOKEN) }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: livekit-agent

      - name: Confirm agent is running
        uses: livekit/deploy-action@v2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: livekit-agent
          TIMEOUT: 5m
